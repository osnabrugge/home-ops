---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: ${APP}
spec:
  compression:
    compressor: zstd
  mover:
    cache:
      capacity: ${KOPIUR_CAPACITY:=5Gi}
      mode: Persistent
      storageClassName: openebs-hostpath
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
  repository:
    kind: ClusterRepository
    name: nas01
  retention:
    keepLatest: 3
    keepHourly: 24
    keepDaily: 7
    keepWeekly: 4
  sources:
    - sourcePathOverride: /postgres/${CNPG_DATABASE}
      stream:
        fileName: ${CNPG_DATABASE}.dump
        workloadExec:
          command:
            - pg_dump
            - --format=custom
            - --no-password
            - --dbname=${CNPG_DATABASE}
          container: postgres
          podSelector:
            matchLabels:
              cnpg.io/cluster: ${CNPG_CLUSTER}
              cnpg.io/instanceRole: primary
          timeout: 10m
