---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: ${APP}
spec:
  compression:
    compressor: zstd
  errorHandling:
    # Opt-in per app. Lets a snapshot complete-with-errors instead of failing outright
    # when a single file is unreadable by the uid-1000 mover (e.g. frigate's .jwt_secret,
    # written root:1000 mode 0600). Running the mover as root is NOT an alternative here:
    # the nas02 NFS export uses root_squash, so a uid-0 mover cannot read /repo at all.
    ignoreFileErrors: ${KOPIUR_IGNORE_FILE_ERRORS:=false}
  mover:
    cache:
      capacity: ${KOPIUR_CAPACITY:=5Gi}
      mode: Persistent
      storageClassName: openebs-hostpath
    securityContext:
      runAsUser: ${KOPIUR_PUID:=1000}
      runAsGroup: ${KOPIUR_PGID:=1000}
  repository:
    kind: ClusterRepository
    name: nas02
  retention:
    keepLatest: 3
    keepHourly: 24
    keepDaily: 7
    keepWeekly: 4
  sources:
    - pvc:
        name: ${APP}
  volumeSnapshotClassName: ${KOPIUR_SNAPSHOTCLASS:=csi-ceph-blockpool}
