---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: netbox-mcp
spec:
  # Fork of netboxlabs/netbox-mcp-server that adds ~50 create/update/delete tools,
  # so network changes can be written back to NetBox instead of drifting.
  image: docker.io/skuldgerry/netbox-mcp:1.1.0@sha256:5e5af8ec3442569f3a3f989fb0e95248117555d545f7d69664ca758723c86a94
  transport: streamable-http
  mcpPort: 8000
  proxyPort: 8080
  permissionProfile:
    type: builtin
    name: network
  env:
    - name: NETBOX_URL
      value: http://netbox.observability.svc.cluster.local/
    - name: TRANSPORT
      value: http
    - name: HOST
      value: 0.0.0.0
    - name: PORT
      value: "8000"
    - name: VERIFY_SSL
      value: "false"
  secrets:
    - name: netbox-mcp-secret
      key: NETBOX_TOKEN
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          envFrom:
            - secretRef:
                name: netbox-mcp-secret
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 384Mi
  groupRef:
    name: mcp-tools
