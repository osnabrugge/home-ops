---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: grafana-mcp
spec:
  podTemplateSpec:
    metadata:
      annotations:
        secret.reloader.stakater.com/reload: grafana-mcp-secret
  image: docker.io/grafana/mcp-grafana:1.4.0@sha256:13cf62271d456750e3371051a7e3927339ad956f3ac5e7b998a943472b48be1c
  transport: streamable-http
  proxyPort: 8080
  mcpPort: 8000
  secrets:
    - name: grafana-mcp-secret
      key: token
      targetEnvName: GRAFANA_SERVICE_ACCOUNT_TOKEN
  env:
    - name: GRAFANA_URL
      value: http://grafana-service.observability.svc.cluster.local:3000
  permissionProfile:
    type: builtin
    name: network
  args:
    - --transport
    - streamable-http
    - --address
    - 0.0.0.0:8000
    # ToolHive is the trusted reverse proxy and may rewrite the Host header.
    - --allowed-hosts
    - "*"
  resources:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      memory: 384Mi
  groupRef:
    name: mcp-tools
