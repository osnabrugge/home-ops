---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: talos-mcp-talosconfig
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azurekv
  target:
    name: talos-mcp-talosconfig
    template:
      data:
        # talosctl looks for /var/run/secrets/talos.dev/config by default, so the
        # key must be "config" for the mount to be picked up.
        config: "{{ .talosconfig }}"
  data:
    - secretKey: talosconfig
      remoteRef:
        key: talos-mcp-talosconfig
