---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/v1/persistentvolumeclaim.json
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: memory-mcp
spec:
  # CephFS rather than ceph-block: the emergency_ro cascade that repeatedly wedges
  # this cluster is a krbd failure, and CephFS uses a different driver.
  storageClassName: ceph-filesystem
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 1Gi
