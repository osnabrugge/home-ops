---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1alpha1.json
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServer
metadata:
  name: hass-mcp
spec:
  image: ghcr.io/homeassistant-ai/ha-mcp:8.4.0@sha256:ff80e07eeb4652a22e781c12883204888b8bce0a95b4b875fa7e74c6b0f32767
  transport: streamable-http
  env:
    - name: HOMEASSISTANT_URL
      value: https://hass.homeops.ca
  secrets:
    - name: hass-mcp-secret
      key: HOMEASSISTANT_TOKEN
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          command:
            - ha-mcp-web
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  groupRef:
    name: mcp-tools
