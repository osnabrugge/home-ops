---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1alpha1.json
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServer
metadata:
  name: onshape-mcp
spec:
  # Upstream ships a Python package only, so this image is built from a pinned
  # commit by .github/workflows/onshape-mcp-image.yaml.
  image: ghcr.io/osnabrugge/onshape-mcp:0.3.0
  # Upstream speaks stdio; toolhive's proxy fronts it with streamable-http.
  transport: stdio
  proxyPort: 8080
  permissionProfile:
    type: builtin
    name: network
  secrets:
    - name: onshape-mcp-secret
      key: ONSHAPE_ACCESS_KEY
    - name: onshape-mcp-secret
      key: ONSHAPE_SECRET_KEY
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          envFrom:
            - secretRef:
                name: onshape-mcp-secret
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 384Mi
  groupRef:
    name: mcp-tools
