---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: toolhive
components:
  - ../../components/alerts
  # kopiur mover Jobs load repo creds via envFrom, which is namespace-local
  - ../../components/kopiur/secret
resources:
  - ./namespace.yaml
  # Namespace root owns SOPS decryption; child namespaces have no age key.
  - ./mcp-servers/proxmox/auth.sops.yaml
  - ./operator/ks.yaml
  - ./mcp-servers
