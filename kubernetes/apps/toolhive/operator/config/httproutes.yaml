---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: toolhive
  annotations:
    # MCP endpoints answer 406 to a plain GET (they require
    # Accept: text/event-stream), so the ingress root can never return 2xx.
    gatus.home-operations.com/endpoint: |-
      path: /health
spec:
  hostnames:
    - mcp.homeops.ca
  parentRefs:
    - name: envoy-external
      namespace: network
  rules:
    - backendRefs:
        # Operator names the Service after the VirtualMCPServer with a vmcp- prefix.
        - name: vmcp-toolhive
          port: 4483
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: toolhive-safe
  annotations:
    gatus.home-operations.com/endpoint: |-
      path: /health
spec:
  hostnames:
    - mcp-safe.homeops.ca
  parentRefs:
    - name: envoy-external
      namespace: network
  rules:
    - backendRefs:
        - name: vmcp-toolhive-safe
          port: 4483
