# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-kubectl
  annotations:
    # MCP endpoints answer 406 to a plain GET (they require
    # Accept: text/event-stream), so the ingress root can never return 2xx.
    # /health does: verified 200 on netbox/github/arr/talos/brocade.
    gatus.home-operations.com/endpoint: |-
      path: /health
spec:
  # INTERNAL ONLY. The ToolHive proxies carry no auth of their own, so every
  # caller inherits the server's ServiceAccount. kubectl's SA can read cluster
  # state - never place this on envoy-external. Same rule as radar.
  hostnames:
    - mcp-kubectl.homeops.ca
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        - name: mcp-kubectl-mcp-proxy
          port: 8080
---
