---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: github-mcp
spec:
  image: ghcr.io/github/github-mcp-server:v2.1.0@sha256:f6056fc10bfffcc8c81a6417a2e9ca12808647e8dd6049642a4feaadee0e0f8a
  transport: streamable-http
  proxyMode: streamable-http
  proxyPort: 8080
  mcpPort: 8000
  env:
    - name: GITHUB_API_URL
      value: https://api.githubcopilot.com/mcp/insiders
    - name: LOG_LEVEL
      value: info
  secrets:
    - name: github-mcp-secret
      key: token
      targetEnvName: GITHUB_PERSONAL_ACCESS_TOKEN
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          # github-mcp-server takes a subcommand, not --transport; --listen-host
          # defaults to every interface.
          args:
            - http
            - --port=8000
  groupRef:
    name: mcp-tools
