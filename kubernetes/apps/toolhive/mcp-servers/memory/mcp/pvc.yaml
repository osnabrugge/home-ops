---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/v1/persistentvolumeclaim.json
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: memory-mcp
spec:
  # ceph-filesystem was tried first (CephFS avoids the krbd emergency_ro cascade)
  # but CephFS has never been exercised on this cluster and mounts fail with
  # "no mds is up ... or you may not be authorized" despite MDS active and CSI
  # caps correct. Revisit once CephFS is proven.
  storageClassName: ceph-block
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
