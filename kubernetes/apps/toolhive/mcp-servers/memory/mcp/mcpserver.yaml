---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: memory-mcp
spec:
  image: ghcr.io/bjw-s-labs/mcp-memory:2026.8.31@sha256:81f1ec66d6c771a516f47705a827b6ac7400e197b4f48b487c3488ee68f2f72d
  transport: stdio
  groupRef:
    name: mcp-tools
  podTemplateSpec:
    spec:
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: memory-mcp
      containers:
        - name: mcp
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command:
                - flock
                - -n
                - /data/.storage-readiness.lock
                - node
                - -e
                - |
                  const fs = require("fs");
                  const directory = fs.mkdtempSync("/data/.storage-readiness-");
                  const path = directory + "/check";
                  let fd;
                  try {
                    fd = fs.openSync(path, "wx", 0o600);
                    fs.writeSync(fd, "ready");
                    fs.fsyncSync(fd);
                  } finally {
                    if (fd !== undefined) fs.closeSync(fd);
                    if (fs.existsSync(path)) fs.unlinkSync(path);
                    fs.rmdirSync(directory);
                  }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 2
