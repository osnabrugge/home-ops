---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-victorialogs
  annotations:
    # MCP endpoints answer 406 to a plain GET (they require
    # Accept: text/event-stream), so the ingress root can never return 2xx.
    # /health does: verified 200 on netbox/github/arr/talos/brocade.
    gatus.home-operations.com/endpoint: |-
      path: /health
spec:
  # INTERNAL ONLY - reads every log line the cluster and the LAN ship to
  # VictoriaLogs, which includes secrets that apps log by accident.
  hostnames:
    - mcp-victorialogs.homeops.ca
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        - name: mcp-victorialogs-mcp-proxy
          port: 8080
