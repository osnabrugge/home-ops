---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-printguard
  annotations:
    # MCP endpoints answer 406 to a plain GET (they require
    # Accept: text/event-stream), so the ingress root can never return 2xx.
    gatus.home-operations.com/endpoint: |-
      path: /health
spec:
  hostnames:
    - mcp-printguard.homeops.ca
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        - name: mcp-printguard-mcp-remote-proxy
          port: 8080
