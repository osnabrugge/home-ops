---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: memory-service
spec:
  # Primary semantic memory store; retain legacy comparison data during the pilot.
  # Search rank is not authority. Graph extraction/automatic supersession are not
  # trusted substitutes for dated evidence and reviewed corrections.
  # Uses backup (not policy) because this PVC is new: kopiur can provision it
  # with the dataSourceRef in place from the start, which is immutable later.
  components:
    - ../../../../../components/kopiur/backup
  dependsOn:
    - name: toolhive-operator
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  path: ./kubernetes/apps/toolhive/mcp-servers/memory-service/mcp
  postBuild:
    substitute:
      APP: memory-service
      KOPIUR_CAPACITY: 5Gi
  wait: false
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: toolhive
