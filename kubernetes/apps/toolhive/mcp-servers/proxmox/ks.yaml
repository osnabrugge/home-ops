---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: proxmox-mcp
spec:
  dependsOn:
    - name: toolhive-operator
    - name: azurekv
      namespace: external-secrets
  interval: 1h
  path: ./kubernetes/apps/toolhive/mcp-servers/proxmox/mcp
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: toolhive
