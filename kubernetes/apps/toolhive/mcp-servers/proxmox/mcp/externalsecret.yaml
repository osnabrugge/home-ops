---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: proxmox-mcp
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: azurekv
  target:
    name: proxmox-mcp-config
    template:
      data:
        config.json: |
          {
            "targets": {
              "pve01": {
                "host": "pve01.in.homeops.ca",
                "port": 8006,
                "verify_ssl": true,
                "kind": "standalone",
                "readonly": true,
                "auth": {
                  "user": {{ .PVE01_USER | toJson }},
                  "token_name": {{ .PVE01_TOKEN_NAME | toJson }},
                  "token_value": {{ .PVE01_TOKEN_VALUE | toJson }}
                },
                "ssh": {"allow_node_commands": false}
              },
              "pve02": {
                "host": "pve02.in.homeops.ca",
                "port": 8006,
                "verify_ssl": true,
                "kind": "standalone",
                "readonly": true,
                "auth": {
                  "user": {{ .PVE02_USER | toJson }},
                  "token_name": {{ .PVE02_TOKEN_NAME | toJson }},
                  "token_value": {{ .PVE02_TOKEN_VALUE | toJson }}
                },
                "ssh": {"allow_node_commands": false}
              }
            },
            "logging": {"level": "INFO"},
            "mcp": {
              "host": "0.0.0.0",
              "port": 8000,
              "transport": "STREAMABLE",
              "dns_rebinding_protection": true,
              "allowed_origins": ["https://mcp-proxmox.homeops.ca"],
              "tool_allowlist": ["get_nodes", "get_vms", "get_containers", "get_storage"]
            },
            "command_policy": {"mode": "deny_all"},
            "jobs": {"sqlite_path": "/tmp/proxmox-jobs.sqlite3"}
          }
  data:
    - secretKey: PVE01_USER
      remoteRef:
        key: pve-exporter
        property: PVE_USER
    - secretKey: PVE01_TOKEN_NAME
      remoteRef:
        key: pve-exporter
        property: PVE_TOKEN_NAME
    - secretKey: PVE01_TOKEN_VALUE
      remoteRef:
        key: pve-exporter
        property: PVE_TOKEN_VALUE
    - secretKey: PVE02_USER
      remoteRef:
        key: pve02-mcp
        property: PVE_USER
    - secretKey: PVE02_TOKEN_NAME
      remoteRef:
        key: pve02-mcp
        property: PVE_TOKEN_NAME
    - secretKey: PVE02_TOKEN_VALUE
      remoteRef:
        key: pve02-mcp
        property: PVE_TOKEN_VALUE
