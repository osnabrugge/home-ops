---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: proxmox-mcp
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: azurekv
  target:
    name: proxmox-mcp-config
    template:
      data:
        config.json: |
          {
            "proxmox": {
              "host": "pve01.in.homeops.ca",
              "port": 8006,
              "verify_ssl": true
            },
            "auth": {
              "user": {{ .PVE_USER | toJson }},
              "token_name": {{ .PVE_TOKEN_NAME | toJson }},
              "token_value": {{ .PVE_TOKEN_VALUE | toJson }}
            },
            "logging": {"level": "INFO"},
            "mcp": {
              "host": "0.0.0.0",
              "port": 8000,
              "transport": "STREAMABLE",
              "dns_rebinding_protection": true,
              "allowed_hosts": [
                "mcp-proxmox.homeops.ca", "mcp-proxmox.homeops.ca:*",
                "proxmox-mcp", "proxmox-mcp:*",
                "localhost:*", "127.0.0.1:*"
              ],
              "allowed_origins": ["https://mcp-proxmox.homeops.ca"],
              "tool_allowlist": ["get_nodes", "get_vms", "get_containers", "get_storage"]
            },
            "command_policy": {"mode": "deny_all"},
            "ssh": {"allow_node_commands": false},
            "jobs": {"sqlite_path": "/tmp/proxmox-jobs.sqlite3"}
          }
  # This existing credential was verified to grant only *.Audit privileges.
  dataFrom:
    - extract:
        key: pve-exporter
