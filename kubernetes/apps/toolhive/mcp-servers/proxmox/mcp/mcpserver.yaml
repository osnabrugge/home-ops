---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: proxmox-mcp
spec:
  image: ghcr.io/rekklesna/proxmoxmcp-plus:v0.7.0@sha256:074832b6c3d7df8d2a342224774961cfe2de96be9fd47b1e639a137a79d14e5a
  transport: streamable-http
  proxyMode: streamable-http
  proxyPort: 8080
  mcpPort: 8000
  env:
    - name: PROXMOX_MCP_MODE
      value: mcp-http
    - name: PROXMOX_MCP_CONFIG
      value: /config/config.json
    - name: PYTHONDONTWRITEBYTECODE
      value: "1"
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 512Mi
  podTemplateSpec:
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          # ToolHive reapplies MCP_TRANSPORT after template env merging.
          command:
            ["/usr/bin/env", "MCP_TRANSPORT=STREAMABLE", "python", "-m", "proxmox_mcp.server"]
          env:
            # The proxy uses DNS for initialization and the Service IP for sessions.
            - name: MCP_ALLOWED_HOSTS
              value: "mcp-proxmox-mcp:8000,$(MCP_PROXMOX_MCP_SERVICE_HOST):8000,mcp-proxmox.homeops.ca,mcp-proxmox.homeops.ca:*,localhost:*,127.0.0.1:*"
            - name: MCP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: proxmox-mcp-auth
                  key: api-key
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 2
            timeoutSeconds: 1
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          secret:
            secretName: proxmox-mcp-config
        - name: tmp
          emptyDir: {}
