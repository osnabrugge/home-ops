---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: proxmox-mcp
spec:
  image: ghcr.io/rekklesna/proxmoxmcp-plus:0.6.8@sha256:46ecf53b960f9487bd5a1573018016b51e8267b718c51ff4e29b4ceed385fa8c
  transport: streamable-http
  proxyMode: streamable-http
  proxyPort: 8080
  mcpPort: 8000
  env:
    - name: PROXMOX_MCP_MODE
      value: mcp-http
    - name: PROXMOX_MCP_CONFIG
      value: /config/config.json
    - name: PYTHONDONTWRITEBYTECODE
      value: "1"
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 512Mi
  podTemplateSpec:
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          env:
            # The image's loader accepts STREAMABLE, not ToolHive's transport spelling.
            - name: MCP_TRANSPORT
              value: STREAMABLE
            - name: MCP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: proxmox-mcp-auth
                  key: api-key
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          secret:
            secretName: proxmox-mcp-config
        - name: tmp
          emptyDir: {}
