---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: kubectl-mcp
spec:
  image: ghcr.io/rohitg00/kubectl-mcp-server:2.0.0@sha256:f1f57aa5d4952f3c49e4d9bb8071a143d0812bdc8253922d51eeca8a2615ea29
  transport: streamable-http
  proxyMode: streamable-http
  proxyPort: 8080
  mcpPort: 8000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  serviceAccount: kubectl-mcp-readonly
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          env:
            - name: MCP_ALLOW_UNAUTHENTICATED
              value: "true"
            - name: MCP_ALLOWED_HOSTS
              value: "*"
            - name: MCP_ALLOWED_ORIGINS
              value: "*"
            - name: MCP_MASK_SECRETS
              value: "true"
            - name: MCP_SAFETY_MODE
              value: read-only
            - name: MCP_SERVER_HOST
              value: 0.0.0.0
            - name: MCP_SERVER_PORT
              value: "8000"
            - name: MCP_SERVER_TRANSPORT
              value: http
            - name: MCP_TOOLSETS
              value: "default,certs,crds,diagnostics,ops,security"
            - name: MCP_TOOL_SEARCH
              value: "true"
  groupRef:
    name: mcp-tools
