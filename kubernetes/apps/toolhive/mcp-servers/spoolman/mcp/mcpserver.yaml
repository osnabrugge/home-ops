---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: spoolman-mcp
spec:
  # Built from /Disane87/spoolman-mcp by osnabrugge/container-images (apps/spoolman-mcp).
  # NOTE: container-images normalised the tag to :1.0.1 (no "v" prefix). Keep this
  # on :v1.0.1 until the first build there publishes :1.0.1, then bump.
  image: ghcr.io/osnabrugge/spoolman-mcp:v1.0.1
  transport: stdio
  proxyMode: streamable-http
  proxyPort: 8080
  permissionProfile:
    type: builtin
    name: network
  env:
    - name: SPOOLMAN_URL
      value: "http://spoolman.printing.svc.cluster.local:8000"
  resources:
    requests:
      cpu: 10m
      memory: 30Mi
    limits:
      memory: 128Mi
  groupRef:
    name: mcp-tools
