---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: onshape-mcp
spec:
  # Upstream ships a Python package only, so this image is built from a pinned
  # commit by osnabrugge/container-images (apps/onshape-mcp).
  # Digest-pinned: 0.3.1 was re-pushed with the mcp<2 fix and nodes kept the stale copy.
  image: ghcr.io/osnabrugge/onshape-mcp:0.3.1@sha256:73f20e93aea154217bf6879412cd3681978aaabc13e31a2eef3c2fb2287039c9
  # Upstream speaks stdio; toolhive's proxy fronts it with streamable-http.
  transport: stdio
  proxyPort: 8080
  permissionProfile:
    type: builtin
    name: network
  # spec.secrets is keyed by secret name, so it cannot carry both keys from one
  # secret; envFrom injects ONSHAPE_ACCESS_KEY and ONSHAPE_SECRET_KEY together.
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          envFrom:
            - secretRef:
                name: onshape-mcp-secret
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 384Mi
  groupRef:
    name: mcp-tools
