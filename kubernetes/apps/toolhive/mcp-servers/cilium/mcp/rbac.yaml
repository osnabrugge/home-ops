---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cilium-mcp
---
# Reuses the broad read-only ClusterRole from kubectl-mcp (secrets excluded).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cilium-mcp-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubectl-mcp-readonly
subjects:
  - kind: ServiceAccount
    name: cilium-mcp
    namespace: toolhive
---
# Write access limited to the Cilium API group: enables the cilium/hubble tools to
# manage network policies and endpoints, but nothing outside Cilium CRDs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cilium-mcp-write
rules:
  - apiGroups:
      - cilium.io
    resources:
      - "*"
    verbs:
      - create
      - patch
      - update
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cilium-mcp-write
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cilium-mcp-write
subjects:
  - kind: ServiceAccount
    name: cilium-mcp
    namespace: toolhive
