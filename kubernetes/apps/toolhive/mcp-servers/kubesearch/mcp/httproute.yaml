---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-kubesearch
  annotations:
    gatus.home-operations.com/endpoint: |-
      path: /health
spec:
  hostnames:
    - mcp-kubesearch.homeops.ca
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        - name: mcp-kubesearch-mcp-proxy
          port: 8080
