---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: litellm-key-policy
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            ai.homeops.ca/role: key-policy
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reconcile
              image: docker.io/library/python:3.14-slim
              command: ["python", "/scripts/key_policy.py"]
              env:
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: LITELLM_BASE_URL
                  value: http://litellm.ai.svc.cluster.local:4000
                - name: LITELLM_MASTER_KEY
                  valueFrom:
                    secretKeyRef:
                      name: litellm-auth
                      key: master-key
                - name: TRIAGE_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: litellm-auth
                      key: triage-key
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: litellm-key-policy
