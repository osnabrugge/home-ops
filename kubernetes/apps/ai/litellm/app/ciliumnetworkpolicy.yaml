---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: litellm
spec:
  endpointSelector:
    matchLabels:
      ai.homeops.ca/role: gateway
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
        - matchLabels:
            ai.homeops.ca/role: triage-worker
        - matchLabels:
            ai.homeops.ca/role: key-policy
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
    - fromEntities: [host, remote-node]
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
  egress:
    - toServices:
        - k8sService:
            serviceName: ollama
            namespace: ai
      toPorts:
        - ports:
            - port: "11434"
              protocol: TCP
    - toServices:
        - k8sService:
            serviceName: litellm-db-rw
            namespace: ai
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toServices:
        - k8sService:
            serviceName: mcp-kubesearch-mcp-proxy
            namespace: toolhive
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: litellm-key-policy
spec:
  endpointSelector:
    matchLabels:
      ai.homeops.ca/role: key-policy
  egress:
    - toEndpoints:
        - matchLabels:
            ai.homeops.ca/role: gateway
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
