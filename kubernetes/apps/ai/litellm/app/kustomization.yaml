---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./configmap.yaml
  - ./key-policy.yaml
  - ./ciliumnetworkpolicy.yaml
configMapGenerator:
  - name: litellm-key-policy
    files:
      - key_policy.py
generatorOptions:
  disableNameSuffixHash: true
