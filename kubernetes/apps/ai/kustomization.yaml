---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai

components:
  - ../../components/alerts
  - ../../components/kopiur/secret

resources:
  - ./namespace.yaml
  # The flux-system root owns decryption; child namespaces do not hold its age key.
  - ./secret.sops.yaml
  - ./litellm/ks.yaml
  - ./ollama/ks.yaml
  - ./triage-worker/ks.yaml
