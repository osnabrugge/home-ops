---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai

components:
  - ../../components/alerts
  - ../../components/kopiur/secret

resources:
  - ./namespace.yaml
  - ./secret.sops.yaml
  - ./bifrost/ks.yaml
  - ./litellm/ks.yaml
  - ./memini/ks.yaml
  - ./ollama/ks.yaml
  - ./triage-worker/ks.yaml

# Preserve the staged Memini configuration without commissioning another workload.
patches:
  - target:
      group: kustomize.toolkit.fluxcd.io
      version: v1
      kind: Kustomization
      name: memini
    patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: memini
      spec:
        suspend: true
