---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bifrost
spec:
  hostnames:
    - bifrost.homeops.ca
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        # Full-proxy SSO protects the management API; never route around it.
        - name: authentik-server
          namespace: auth
          port: 80
