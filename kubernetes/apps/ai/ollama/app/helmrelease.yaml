---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ollama
spec:
  chartRef:
    kind: OCIRepository
    name: ollama
  interval: 1h
  values:
    controllers:
      ollama:
        containers:
          app:
            image:
              repository: docker.io/ollama/ollama
              tag: 0.40.13
            env:
              HOME: /tmp
              OLLAMA_HOST: "0.0.0.0:11434"
              OLLAMA_MODELS: /models
              OLLAMA_NUM_PARALLEL: "1"
              OLLAMA_MAX_LOADED_MODELS: "1"
              OLLAMA_CONTEXT_LENGTH: "8192"
              OLLAMA_KEEP_ALIVE: 5m
              OLLAMA_NO_CLOUD: "true"
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: "1"
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/tags
                    port: 11434
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/tags
                    port: 11434
                  timeoutSeconds: 5
    defaultPodOptions:
      nodeSelector:
        kubernetes.io/hostname: k8s06
      # Registry names must resolve directly so FQDN egress observes the real name.
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      labels:
        ai.homeops.ca/role: local-model
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        ports:
          http:
            port: 11434
    persistence:
      models:
        existingClaim: ollama
        globalMounts:
          - path: /models
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
