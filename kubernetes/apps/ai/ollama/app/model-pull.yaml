---
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-qwen3-06b-pull
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        ai.homeops.ca/role: model-loader
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/hostname: k8s06
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pull
          image: docker.io/ollama/ollama:0.40.13
          command: ["/bin/ollama", "pull", "qwen3:0.6b"]
          env:
            - name: OLLAMA_HOST
              value: http://ollama.ai.svc.cluster.local:11434
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
