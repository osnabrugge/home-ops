---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ai-triage-worker
spec:
  # Pilot observes only the known SMART alert; it cannot repair or close issues.
  schedule: "7,37 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            ai.homeops.ca/role: triage-worker
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          dnsConfig:
            options:
              - name: ndots
                value: "1"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: triage
              image: docker.io/library/python:3.15-slim
              command: ["python", "/scripts/worker.py"]
              env:
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: LITELLM_BASE_URL
                  value: http://litellm.ai.svc.cluster.local:4000
                - name: LITELLM_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: litellm-auth
                      key: triage-key
                - name: PROMETHEUS_URL
                  value: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: ai-triage-worker
