---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ai-triage-worker
spec:
  endpointSelector:
    matchLabels:
      ai.homeops.ca/role: triage-worker
  egress:
    - toEndpoints:
        - matchLabels:
            ai.homeops.ca/role: gateway
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: nas01.in.homeops.ca
      toPorts:
        - ports:
            - port: "9633"
              protocol: TCP
