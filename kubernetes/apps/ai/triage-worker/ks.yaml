---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ai-triage-worker
spec:
  dependsOn:
    - name: litellm
  interval: 1h
  path: ./kubernetes/apps/ai/triage-worker/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  wait: true
