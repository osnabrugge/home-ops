---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app printguard
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    controllers:
      printguard:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/oliverbravery/printguard
              tag: 2.3.12-intel@sha256:22d7e95b0d7361e32826ea1ee410730e1558a7f138956e21d7d5e20423a3fb2b
            env:
              TZ: America/Toronto
              DATA_DIR: /data
              PRINTGUARD_ORIGINS: "https://{{ .Release.Name }}.homeops.ca"
              MEDIAMTX_API: http://localhost:9997
              MEDIAMTX_RTSP: rtsp://localhost:8554
              MEDIAMTX_HLS: http://localhost:8888
              PRINTGUARD_SECRET_KEY:
                valueFrom:
                  secretKeyRef:
                    name: printguard-secret
                    key: password
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 8000
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: {drop: ["ALL"]}
            resources:
              claims:
                - name: gpu
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 3Gi
          mediamtx:
            image:
              repository: docker.io/bluenviron/mediamtx
              tag: 1.20.0@sha256:86e63af28616d5e5a18540d7b031b6510bd4cbf1a3c7d224f9e2976f02aefbfb
            env:
              TZ: America/Toronto
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 9997
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 9997
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: *app
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
            appProtocol: http
          rtsp:
            port: 8554
            appProtocol: rtsp
          rtmp:
            port: 1935
            appProtocol: rtmp
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.homeops.ca"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          printguard:
            app:
              - path: /data
      mediamtx-config:
        type: configMap
        identifier: mediamtx
        advancedMounts:
          printguard:
            mediamtx:
              - path: /mediamtx.yml
                subPath: mediamtx.yml
                readOnly: true
    configMaps:
      mediamtx:
        data:
          mediamtx.yml: |
            api: yes
            apiAddress: :9997
            authInternalUsers:
              - user: any
                permissions:
                  - action: publish
                  - action: read
                  - action: playback
                  - action: api
            rtsp: yes
            rtspAddress: :8554
            rtmp: yes
            rtmpAddress: :1935
            hls: yes
            hlsAddress: :8888
            hlsVariant: fmp4
            hlsSegmentCount: 3
            hlsSegmentDuration: 1s
            webrtc: no
            srt: no
            paths:
              all_others:
