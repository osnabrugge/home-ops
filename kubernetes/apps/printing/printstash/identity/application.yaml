---
apiVersion: authentik.starry.blue/v1alpha1
kind: AuthentikApplication
metadata:
  name: printstash
spec:
  slug: printstash
  name: PrintStash
  group: Printing
  deletionPolicy: Retain
  adopt: Never
  provider:
    flows:
      authorization:
        slug: default-provider-authorization-implicit-consent
      invalidation:
        slug: default-provider-invalidation-flow
    oauth2:
      clientType: Confidential
      redirectURIs:
        - url: https://printstash.homeops.ca/api/v1/auth/oidc/callback
          matchingMode: Strict
      scopes:
        - scopeName: openid
        - scopeName: profile
        - scopeName: email
        - scopeName: printstash
      grantTypes:
        - AuthorizationCode
      signingKey:
        name: authentik Self-signed Certificate
      credentials:
        clientID: printstash
        secretRef:
          name: printstash-oidc
  access:
    mode: Any
    rules:
      - group:
          name: authentik Admins
      - user:
          username: sean
