---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: printstash-oidc
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: azurekv
  target:
    name: printstash-oidc
    deletionPolicy: Retain
    template:
      data:
        client-secret: "{{ .OIDC_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: printstash-oidc
