---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ocharted
spec:
  chartRef:
    kind: OCIRepository
    name: ocharted
  interval: 1h
  values:
    replicaCount: 2
    podDisruptionBudget:
      enabled: true
    auth:
      existingSecret: ocharted-secret
      bypassNetworks:
        - 10.42.0.0/16
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    httpRoute:
      enabled: true
      annotations:
        gatus.home-operations.com/endpoint: |-
          path: /healthz
          conditions: ["[STATUS] == 200"]
      hostnames:
        - "{{ .Release.Name }}.homeops.ca"
      # envoy-internal, not -external: on the external gateway the name resolves
      # to Cloudflare, so pulls re-enter from a public IP and never match
      # auth.bypassNetworks (ocharted checks the socket peer and ignores XFF),
      # returning 401. Internally it resolves to the LAN envoy LB and the
      # proxying pod IS in 10.42/16. That also gives a real TLS endpoint, which
      # flate requires: it maps spec.insecure to InsecureSkipVerify over HTTPS
      # rather than to plain HTTP as source-controller does.
      parentRefs:
        - name: envoy-internal
          namespace: network
    monitoring:
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 512Mi
