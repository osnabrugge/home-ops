---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ocharted
spec:
  chartRef:
    kind: OCIRepository
    name: ocharted
  interval: 1h
  values:
    replicaCount: 2
    podDisruptionBudget:
      enabled: true
    auth:
      existingSecret: ocharted-secret
      # No bypassNetworks. ocharted authorises on the SOCKET PEER, and every
      # request arrives from an envoy pod inside 10.42.0.0/16 — its own logs show
      # remote=10.42.x.x with the real client only in xff. A 10.42.0.0/16 bypass
      # therefore matches traffic from the EXTERNAL gateway too, since cloudflared
      # and envoy-external are both in-cluster, which would make this an open
      # unauthenticated proxy the moment it is published. Both consumers already
      # carry the ocharted-pull dockerconfigjson, so they authenticate instead.
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    httpRoute:
      enabled: true
      annotations:
        gatus.home-operations.com/endpoint: |-
          path: /healthz
          conditions: ["[STATUS] == 200"]
      hostnames:
        - "{{ .Release.Name }}.homeops.ca"
      # Published on BOTH gateways. Internal keeps in-cluster pulls on the LAN
      # path and gives flate the real TLS endpoint it needs (it maps spec.insecure
      # to InsecureSkipVerify over HTTPS rather than to plain HTTP as
      # source-controller does). External is what lets Renovate resolve chart
      # versions from a GitHub-hosted runner, retiring the overrideDatasource
      # rules in .renovaterc.json5. Safe ONLY because auth.bypassNetworks was
      # removed above: ocharted sees an in-cluster envoy peer on both paths and
      # cannot tell them apart, so the bypass would have covered public traffic.
      parentRefs:
        - name: envoy-internal
          namespace: network
        - name: envoy-external
          namespace: network
    monitoring:
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 512Mi
