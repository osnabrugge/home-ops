---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/k8s.cni.cncf.io/networkattachmentdefinition_v1.json
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: guest
spec:
  # No default route: consumers already hold one via the lan attach, and the
  # guest VLAN is internet-only. This exists purely for L2 adjacency.
  config: |-
    {
      "cniVersion": "0.3.1",
      "name": "guest",
      "plugins": [
        {
          "type": "macvlan",
          "master": "bond0.50",
          "mode": "bridge",
          "ipam": {
            "type": "static"
          }
        }
      ]
    }
