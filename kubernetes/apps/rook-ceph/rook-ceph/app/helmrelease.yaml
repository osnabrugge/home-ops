---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
spec:
  chartRef:
    kind: OCIRepository
    name: rook-ceph
  interval: 1h
  values:
    csi:
      cephFSKernelMountOptions: ms_mode=prefer-crc
    image:
      repository: ghcr.io/rook/ceph
    monitoring:
      enabled: true
    resources:
      requests:
        cpu: 100m # unchangable
        memory: 128Mi # unchangable
      # The chart defaults to 512Mi, and `limits: {}` does not clear it because
      # Helm merges maps. The operator peaked at 477Mi over a normal week (93% of
      # that) and was OOMKilled on k8s05 during the 2026-10-01 cephx incident —
      # precisely when it was needed to reconcile the cluster back to health.
      limits:
        memory: 1Gi
