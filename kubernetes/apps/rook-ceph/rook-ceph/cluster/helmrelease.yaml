---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
spec:
  chartRef:
    kind: OCIRepository
    name: rook-ceph-cluster
  interval: 1h
  timeout: 10m
  values:
    # Pin the Ceph image FORWARD at v20.2.2. On 2026-07-08 the rook chart bump
    # v1.20.1->v1.20.2 started a Ceph 20.2.1->20.2.2 upgrade (mons/mgr/mds reached
    # 20.2.2); the HR upgrade timed out mid-roll and Flux auto-rolled-back to
    # v1.20.1, reverting the image to v20.2.1. mon.i (store already 20.2.2) then
    # crashlooped on 20.2.1 ("unsupported features: incompat 32=nvmeof beacon").
    # Ceph forbids downgrades, so we pin forward to where the mons already are.
    #
    # Chart v1.20.2 MOVED image config out of cephClusterSpec.cephVersion into this
    # top-level cephImage key (dedicated template block in cephcluster.yaml). Leaving
    # the old cephClusterSpec.cephVersion in place rendered cephVersion TWICE, so
    # Flux's post-render YAML parse failed and the HR upgrade got stuck (failing
    # every 15m since 2026-07-08), cascading "dependency not ready" to ~40 apps.
    #
    # cephImage is deliberately NOT overridden: the chart ships a Ceph version
    # matched to its Rook operator release, so pinning it here made Renovate try
    # to bump Ceph independently of Rook.
    cephClusterSpec:
      cleanupPolicy:
        wipeDevicesFromOtherClusters: true
      crashCollector:
        disable: false
      # Scrub throttling for CONSUMER Samsung 970 EVO Plus NVMe (onedr0p uses enterprise
      # Micron 7450). At the Ceph defaults (osd_scrub_sleep=0, osd_max_scrubs=3, no
      # off-peak window) deep scrubs run flat-out and spike read latency on these consumer
      # drives -> OSD sub-op stalls ("waiting for sub ops") -> heartbeat miss -> OSD flap
      # -> RBD clients remount READ-ONLY -> app crashloops (qui/HA/zigbee/spoolman etc).
      # Proven NOT physical: enp1s0f0/f1 have 0 errors/drops, bond 0 link-failures, disks
      # 4-7ms, OSDs idle (CPU ~20m, client IO <1MiB/s) when it flaps. Throttling scrubs is
      # the durable, non-physical fix. Applied at runtime 2026-07-05; pinned here.
      cephConfig:
        osd:
          osd_scrub_sleep: "0.1" # sleep between scrub chunks (default 0 = flat-out)
          osd_max_scrubs: "1" # one scrub per OSD at a time (default 3)
          osd_scrub_load_threshold: "5.0" # defer scrub when node load is high
      csi:
        readAffinity:
          enabled: false # https://github.com/ceph/ceph-csi/issues/5772
      dashboard:
        enabled: true
        urlPrefix: /
        ssl: false
        prometheusEndpoint: http://prometheus-operated.observability.svc.cluster.local:9090
      mgr:
        modules:
          - name: pg_autoscaler
            enabled: true
      network:
        connections:
          requireMsgr2: true
      # Rook drops any node whose taints the OSD placement doesn't tolerate (any
      # effect) from the storage spec, so tuppr's soft taint stalled Rook upgrades.
      placement:
        osd:
          tolerations:
            - key: tuppr.home-operations.com/outdated
              operator: Exists
      resources:
        osd:
          limits:
            memory: 8Gi # Required for bootstrap
        mgr:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            # mgr working set sits at ~1Gi (prometheus module + pg_autoscaler) and was
            # pinned at 100% of Rook's 1Gi default, risking OOM -> CephMgr* alerts.
            memory: 2Gi
      # Ceph 20 (Tentacle) added AUTH_INSECURE_* health checks that flag the legacy
      # "aes" cephx cipher as insecure. Our keys are generation 1, minted under
      # keyCephVersion 19.2.3-0 (Squid), so the cluster went HEALTH_ERR after the
      # Tentacle upgrade -> the rook-ceph-cluster Kustomization health check fails
      # -> ~37 Kustomizations stall on "dependency not ready". No data is at risk.
      #
      # Staged on purpose. Rook documents daemon keys as rotatable "without affecting
      # client connections", while CSI rotation "can affect existing PV connections".
      # This is phase 1 (daemons only: mon/mgr/osd/mds/rgw). CSI keys are rotated
      # separately so a bad rotation cannot remount RBD volumes read-only.
      security:
        cephx:
          # No daemon.keyType: Rook auto-detects the best type and the Rook guide
          # says to remove the pin once the mons carry --mon-auth-emergency-allowed-ciphers
          # (they do). Leaving it pinned kept the cluster in the emergency-cipher
          # state where long-running OSDs stopped being able to decrypt their
          # rotating service keys ("could not set rotating key: decode_decrypt
          # failed") roughly an hour after each start, which made them unable to
          # verify any peer authorizer -> -13 for every krbd client.
          # ROTATION DISABLED 2026-10-05 after this broke the cluster twice in 24h.
          # mon/mgr/admin/crashCollector/cephExporter all reached generation 2, but
          # status.cephx.osd stayed {keyGeneration: 1, keyCephVersion: "19.2.3-0"}:
          # Rook cannot finish an OSD key rotation under CV_MODE=raw, because the
          # keyring lives on the device and there is no rook-ceph-osd-N-keyring
          # secret to rewrite. So every reconcile saw desired 2 != actual 1, ran
          # `ceph auth rotate` against the mon, failed the OSD half and never
          # stamped status -- leaving the mon key and the on-disk key permanently
          # out of sync for osd.0/1/4/5.
          #
          # The symptom is NOT obvious: the cluster stays HEALTH_WARN with all PGs
          # active+clean and running pods keep working (their krbd sessions are
          # already authenticated), but those OSDs can no longer decrypt rotating
          # keys and reject every NEW client. `rbd create` hangs forever, which
          # wedges ceph-csi -> no provision/attach/snapshot cluster-wide.
          #
          # keyGeneration stays 2 because the CRD rejects a decrease
          # ("keyGeneration cannot be decreased"); Disabled is what actually stops
          # the retry loop, and is Rook's own default. Re-enable only once the
          # raw-mode OSD rotation bug is fixed upstream, and verify afterwards with
          # the mon-vs-on-disk key fingerprint check for all six OSDs.
          daemon:
            keyRotationPolicy: Disabled
            keyGeneration: 2
          # Phase 2. Safe here only because the rook-csi-* secrets are owned by
          # CephCluster/rook-ceph, so Rook rewrites them in step with Ceph even
          # though the drivers come from the separate ceph-csi-operator chart.
          # keepPriorKeyCountMax keeps the old key valid so live PV connections
          # migrate instead of dropping to read-only.
          #
          # ROLLED BACK TO aes 2026-10-04, RESTORED TO aes256k 2026-10-05.
          # The rollback blamed the kernel for the -13 ("libceph: auth protocol
          # 'cephx' authorization to osd failed"), but the kernel was never the
          # problem: siderolabs/pkgs@84c1b87 backports CEPH_CRYPTO_AES256KRB5 into
          # the 6.18 Talos kernel and ships in every v1.14.x. Verified on all six
          # nodes -- /proc/kallsyms exports ceph_crypto_key_prepare on both
          # 6.18.51-talos (v1.14.1) and 6.18.54-talos (v1.14.2). The real cause was
          # the OSDs failing to decrypt their rotating keys, so they rejected every
          # authorizer regardless of which cipher the client used.
          # keepPriorKeyCountMax was 1 to keep the generation 3 aes key valid for
          # mounts made before the rotation. Every node was drained and rebooted
          # for Talos v1.14.2 on 2026-10-08 and no mon session used a .3 entity
          # afterwards, so the prior aes keys are dropped (Rook's final CSI step).
          csi:
            keyType: aes256k
            keyRotationPolicy: KeyGeneration
            keyGeneration: 4
            keepPriorKeyCountMax: 0
          # Last remaining aes entity. No CephBlockPool has mirroring enabled and
          # there are no peer clusters, so nothing consumes this key today.
          rbdMirrorPeer:
            keyType: aes256k
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
      storage:
        devicePathFilter: /dev/disk/by-id/nvme-Samsung_SSD_970_EVO_Plus_1TB_*
        useAllDevices: false
        useAllNodes: true
    monitoring:
      enabled: true
      createPrometheusRules: true
    toolbox:
      enabled: true
    route:
      dashboard:
        host:
          name: rook.homeops.ca
          path: /
          pathType: PathPrefix
        parentRefs:
          - name: envoy-internal
            namespace: network
    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 3
        storageClass:
          enabled: true
          name: ceph-block
          allowVolumeExpansion: true
          isDefault: true
          mountOptions:
            - discard
          parameters:
            compression_algorithm: zstd
            compression_mode: passive
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-publish-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-publish-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            imageFeatures: deep-flatten,exclusive-lock,fast-diff,layering,object-map
            imageFormat: "2"
          reclaimPolicy: Delete
          volumeBindingMode: Immediate
    cephBlockPoolsVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-blockpool
      deletionPolicy: Delete
      isDefault: true
    cephFileSystems:
      - name: ceph-filesystem
        spec:
          metadataPool:
            replicated:
              size: 3
          dataPools:
            - name: data0
              failureDomain: host
              replicated:
                size: 3
          metadataServer:
            activeCount: 1
            activeStandby: true
            placement:
              topologySpreadConstraints:
                - maxSkew: 1
                  topologyKey: kubernetes.io/hostname
                  whenUnsatisfiable: DoNotSchedule
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: ceph-mds
                      app.kubernetes.io/part-of: ceph-filesystem
            priorityClassName: system-cluster-critical
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi
        storageClass:
          enabled: true
          name: ceph-filesystem
          allowVolumeExpansion: true
          isDefault: false
          parameters:
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-publish-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/controller-publish-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
          pool: data0
          reclaimPolicy: Delete
          volumeBindingMode: Immediate
    cephFileSystemVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-filesystem
      deletionPolicy: Delete
      isDefault: false
    cephObjectStores:
      # S3-compatible object store (RGW). Primary use: CNPG barman backups for
      # postgres16 (see kubernetes/apps/database/cloudnative-pg). Replicated x3
      # pools, host failure domain — mirrors the cephFilesystem layout.
      - name: ceph-objectstore
        spec:
          metadataPool:
            failureDomain: host
            replicated:
              size: 3
          dataPool:
            failureDomain: host
            replicated:
              size: 3
          preservePoolsOnDelete: true
          gateway:
            port: 80
            instances: 1
            priorityClassName: system-cluster-critical
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
        storageClass:
          enabled: true
          name: ceph-bucket
          reclaimPolicy: Retain
          volumeBindingMode: Immediate
          parameters:
            region: us-east-1
