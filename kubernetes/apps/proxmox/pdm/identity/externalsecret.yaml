---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pdm-oidc
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: azurekv
  target:
    name: pdm-oidc
    template:
      data:
        client-secret: "{{ .OIDC_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: proxmox-datacenter-manager
