---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pdm
spec:
  dnsNames: [pdm.homeops.ca]
  duration: 160h
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-production
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  secretName: pdm-tls
  usages: [digital signature]
