---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./externalsecret.yaml
  - ./certificate.yaml
  - ./pvc.yaml
  - ./httproute.yaml
  - ./ciliumnetworkpolicy.yaml
  - ./backup.yaml
configMapGenerator:
  - name: pdm-bootstrap
    files:
      - bootstrap.py
generatorOptions:
  disableNameSuffixHash: true
