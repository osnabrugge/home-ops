---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pdm
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: azurekv
  target:
    name: pdm-bootstrap-secret
    template:
      data:
        settings.json: |
          {
            "recovery_password": {{ .RECOVERY_PASSWORD | toJson }},
            "oidc_client_secret": {{ .OIDC_CLIENT_SECRET | toJson }},
            "oidc_admin": {{ .OIDC_ADMIN | toJson }},
            "remotes": [
              {
                "type": "pve",
                "id": "pve01",
                "nodes": ["pve01.in.homeops.ca:8006"],
                "authid": {{ printf "%s!%s" .PVE01_USER .PVE01_TOKEN_NAME | toJson }},
                "token": {{ .PVE01_TOKEN_VALUE | toJson }},
                "web-url": "https://pve01.in.homeops.ca:8006/"
              },
              {
                "type": "pve",
                "id": "pve02",
                "nodes": ["pve02.in.homeops.ca:8006"],
                "authid": {{ printf "%s!%s" .PVE_USER .PVE_TOKEN_NAME | toJson }},
                "token": {{ .PVE_TOKEN_VALUE | toJson }},
                "web-url": "https://pve02.in.homeops.ca:8006/"
              }
            ]
          }
  dataFrom:
    - extract:
        key: proxmox-datacenter-manager
    - extract:
        key: pve02-mcp
  data:
    - secretKey: PVE01_USER
      remoteRef:
        key: pve-exporter
        property: PVE_USER
    - secretKey: PVE01_TOKEN_NAME
      remoteRef:
        key: pve-exporter
        property: PVE_TOKEN_NAME
    - secretKey: PVE01_TOKEN_VALUE
      remoteRef:
        key: pve-exporter
        property: PVE_TOKEN_VALUE
