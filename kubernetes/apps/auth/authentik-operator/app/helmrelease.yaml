---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik-operator
spec:
  interval: 1h
  chart:
    spec:
      chart: authentik-operator
      version: 2026.8.2
      sourceRef:
        kind: HelmRepository
        name: authentik-operator
  values:
    clusterName: home-ops
    authentik:
      url: https://authentik.homeops.ca
      token:
        secretName: authentik-operator
    crd:
      keep: true
    manager:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
