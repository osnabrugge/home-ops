---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# AKV key: authentik — must contain:
#   AUTHENTIK_SECRET_KEY        (50+ char random, e.g. `openssl rand -base64 60`)
#   AUTHENTIK_DB_PASSWORD       (Postgres password; also used by authentik-db-user)
#   AUTHENTIK_BOOTSTRAP_PASSWORD (initial akadmin password)
#   AUTHENTIK_BOOTSTRAP_TOKEN   (initial akadmin API token, 40+ char random)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: azurekv
  target:
    name: authentik-secret
    template:
      data:
        AUTHENTIK_SECRET_KEY: "{{ .AUTHENTIK_SECRET_KEY }}"
        AUTHENTIK_POSTGRESQL__PASSWORD: "{{ .AUTHENTIK_DB_PASSWORD }}"
        AUTHENTIK_BOOTSTRAP_PASSWORD: "{{ .AUTHENTIK_BOOTSTRAP_PASSWORD }}"
        AUTHENTIK_BOOTSTRAP_TOKEN: "{{ .AUTHENTIK_BOOTSTRAP_TOKEN }}"
  dataFrom:
    - extract:
        key: authentik
