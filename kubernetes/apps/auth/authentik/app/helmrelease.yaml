---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
spec:
  interval: 1h
  chart:
    spec:
      chart: authentik
      version: 2026.8.1
      sourceRef:
        kind: HelmRepository
        name: authentik
  values:
    global:
      podAnnotations:
        reloader.stakater.com/auto: "true"
      deploymentStrategy:
        type: RollingUpdate
      envFrom:
        - secretRef:
            name: authentik-secret
      env:
        - name: AUTHENTIK_REDIS__DB
          value: "3"
    authentik:
      log_level: info
      postgresql:
        host: postgres16-rw.database.svc.cluster.local
        name: authentik
        user: authentik
        port: 5432
      redis:
        host: dragonfly-authentik.database.svc.cluster.local
      email:
        host: smtp-relay.default.svc.cluster.local
        from: notifications@homeops.ca
        port: 25
        use_tls: false
    postgresql:
      enabled: false
    redis:
      enabled: false
    prometheus:
      rules:
        enabled: true
    server:
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 512Mi
        limits:
          memory: 1Gi
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
    worker:
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 512Mi
        limits:
          memory: 1Gi
