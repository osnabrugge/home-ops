---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: cloudnative-pg
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  # Grafana.com 20417 revision 4, with local datasource/label fixes.
  # Keep the datasource variable: datasourceName substitution is not a UID lookup.
  configMapRef:
    name: cloudnative-pg-dashboard-custom
    key: cloudnative-pg.json
