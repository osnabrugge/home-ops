---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
# ExternalSecret for the Authentik PostgreSQL user.
# AKV key: authentik — must contain AUTHENTIK_DB_PASSWORD.
# The authentik role + database are managed declaratively via spec.managed.roles
# in cluster16.yaml and a Database CR (authentik-database.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-db-user
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: azurekv
  target:
    name: authentik-db-user
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: "authentik"
        password: "{{ .AUTHENTIK_DB_PASSWORD }}"
  dataFrom:
    - extract:
        key: authentik
