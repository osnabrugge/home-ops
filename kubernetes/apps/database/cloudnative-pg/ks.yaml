---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnative-pg
spec:
  dependsOn:
    - name: openebs
      namespace: openebs-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: cloudnative-pg
      namespace: database
  interval: 1h
  path: ./kubernetes/apps/database/cloudnative-pg/app
  # Restore after app-owned inventories have claimed the existing resources.
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: database
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnative-pg-cluster
spec:
  # Bootstrap and managed roles need these app-owned passwords before initialization.
  dependsOn:
    - name: cloudnative-pg
    - name: azurekv
      namespace: external-secrets
    - name: authelia-database-credentials
      namespace: auth
    - name: authentik-database-credentials
      namespace: auth
    - name: dispatcharr-database-credentials
      namespace: default
    - name: netbox-database-credentials
      namespace: observability
    - name: netbox-diode-database-credentials
      namespace: observability
    - name: spoolman-database-credentials
      namespace: printing
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: postgres16
      namespace: database
  interval: 1h
  path: ./kubernetes/apps/database/cloudnative-pg/cluster
  # Restore after app-owned inventories have claimed the existing resources.
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: database
  wait: true
