---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: omada-db
spec:
  components:
    - ../../../../components/kopiur/policy
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: azurekv
      namespace: external-secrets
  interval: 1h
  path: ./kubernetes/apps/database/omada-db/app
  postBuild:
    substitute:
      APP: omada-db
      # Claim is provisioned by the mongodb chart, and mongodb owns its data as 1001.
      KOPIUR_PVC: omada-db-mongodb
      KOPIUR_PUID: "1001"
      KOPIUR_PGID: "1001"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: database
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: omada-db
      namespace: database
