---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: azurekv
  target:
    name: kritika-secret
    template:
      data:
        KRITIKA_AUTH_ADMIN_PASSWORD: "{{ .KRITIKA_AUTH_ADMIN_PASSWORD }}"
        KRITIKA_GITHUB_CLIENT_ID: "{{ .GITHUB_BOT_APP_CLIENT_ID }}"
        KRITIKA_GITHUB_PRIVATE_KEY: "{{ .GITHUB_BOT_APP_PRIVATE_KEY_B64 | b64dec }}"
        KRITIKA_GITHUB_WEBHOOK_SECRET: "{{ .GITHUB_BOT_APP_WEBHOOK_SECRET }}"
        KRITIKA_GATEWAY_KEY: "{{ .KRITIKA_GATEWAY_KEY }}"
  dataFrom:
    - extract:
        key: kritika
    - extract:
        key: github-bot
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-policy
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: azurekv
  target:
    name: kritika-policy-secret
    template:
      data:
        OPENROUTER_API_KEY: "{{ .OPENROUTER_API_KEY }}"
        GITHUB_WEBHOOK_SECRET: "{{ .GITHUB_BOT_APP_WEBHOOK_SECRET }}"
        KRITIKA_GATEWAY_KEY: "{{ .KRITIKA_GATEWAY_KEY }}"
  dataFrom:
    - extract:
        key: kritika
    - extract:
        key: github-bot
    - extract:
        key: openrouter
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-db-owner
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: azurekv
  target:
    name: kritika-db-owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: kritika
        password: "{{ .KRITIKA_POSTGRES_OWNER_PASSWORD }}"
        uri: "postgres://kritika:{{ .KRITIKA_POSTGRES_OWNER_PASSWORD }}@kritika-db-direct:5432/kritika?sslmode=require&connect_timeout=10"
  dataFrom:
    - extract:
        key: kritika
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-db-app
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: azurekv
  target:
    name: kritika-db-app
    template:
      type: kubernetes.io/basic-auth
      data:
        username: kritika_app
        password: "{{ .KRITIKA_POSTGRES_APP_PASSWORD }}"
        uri: "postgres://kritika_app:{{ .KRITIKA_POSTGRES_APP_PASSWORD }}@kritika-db-direct:5432/kritika?sslmode=require&connect_timeout=10"
  dataFrom:
    - extract:
        key: kritika
