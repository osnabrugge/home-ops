---
apiVersion: batch/v1
kind: Job
metadata:
  name: kritika-repository-policy-v3
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kritika-repository-policy
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: install-policy
          image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-bookworm@sha256:30d0a38b6df3da24e89a2cfbe800e422c3ef13fa427aa5523f2a7d3fecb53b34
          env:
            - name: PGHOST
              value: kritika-db-direct
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: kritika
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: kritika-db-owner
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: kritika-db-owner
                  key: password
            - name: PGSSLMODE
              value: require
            - name: PGCONNECT_TIMEOUT
              value: "10"
          command:
            - /bin/bash
            - -ec
            - |
              psql --no-psqlrc --set ON_ERROR_STOP=1 <<'SQL'
              BEGIN;
              ALTER TABLE accounts DROP CONSTRAINT IF EXISTS homeops_pilot_account;
              ALTER TABLE accounts ADD CONSTRAINT homeops_pilot_account
                CHECK (NOT enabled OR (forge = 'github' AND name = 'osnabrugge'));
              ALTER TABLE repositories DROP CONSTRAINT IF EXISTS homeops_pilot_repository;
              -- enabled records forge reachability; turned_on is dashboard enablement.
              -- Disable privacy/name/account changes rather than retaining stale public state.
              CREATE OR REPLACE FUNCTION public.homeops_pilot_repository_guard()
                RETURNS trigger LANGUAGE plpgsql
                SET search_path = pg_catalog, public AS $guard$
              BEGIN
                IF NEW.name <> 'osnabrugge/home-ops' OR NEW.visibility <> 'public'
                  OR NOT EXISTS (
                    SELECT 1 FROM public.accounts
                    WHERE id = NEW.account_id AND forge = 'github'
                      AND name = 'osnabrugge' AND enabled
                  )
                THEN
                  NEW.turned_on := false;
                  NEW.turned_at := clock_timestamp();
                END IF;
                RETURN NEW;
              END;
              $guard$;
              DROP TRIGGER IF EXISTS homeops_pilot_repository_guard ON repositories;
              CREATE TRIGGER homeops_pilot_repository_guard
                BEFORE INSERT OR UPDATE ON repositories
                FOR EACH ROW EXECUTE FUNCTION public.homeops_pilot_repository_guard();
              UPDATE repositories SET turned_on = false
                WHERE name <> 'osnabrugge/home-ops' OR visibility <> 'public';
              ALTER TABLE repositories ADD CONSTRAINT homeops_pilot_repository
                CHECK (turned_on IS DISTINCT FROM true
                  OR (name = 'osnabrugge/home-ops' AND visibility = 'public'));
              COMMIT;
              SELECT 'public_homeops_only_policy_installed' AS result;
              SQL
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
