---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kritika-policy
  annotations:
    secret.reloader.stakater.com/reload: kritika-policy-secret
    configmap.reloader.stakater.com/reload: kritika-policy-code
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kritika-policy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kritika-policy
    spec:
      automountServiceAccountToken: false
      dnsConfig:
        options:
          # Avoid search-list queries being refused before the approved FQDN.
          - name: ndots
            value: "1"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: policy
          image: docker.io/library/python:3.13-alpine@sha256:7984cf56ceaddebe4fefeb75d64000b9f45d8b77b11a09b24524da6cdc3af0c8
          command: [python3, -B, /policy/policy.py]
          envFrom:
            - secretRef:
                name: kritika-policy-secret
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          ports:
            - name: models
              containerPort: 8080
            - name: webhooks
              containerPort: 8081
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: webhooks
          livenessProbe:
            httpGet:
              path: /healthz
              port: webhooks
          volumeMounts:
            - name: policy
              mountPath: /policy
              readOnly: true
      volumes:
        - name: policy
          configMap:
            name: kritika-policy-code
---
apiVersion: v1
kind: Service
metadata:
  name: kritika-policy
spec:
  selector:
    app.kubernetes.io/name: kritika-policy
  ports:
    - name: models
      port: 8080
      targetPort: models
    - name: webhooks
      port: 8081
      targetPort: webhooks
---
apiVersion: v1
kind: Service
metadata:
  name: kritika-policy-direct
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: kritika-policy
  ports:
    - name: models
      port: 8080
      targetPort: models
---
apiVersion: v1
kind: Service
metadata:
  name: kritika-api-direct
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: kritika
    app.kubernetes.io/instance: kritika
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 8080
      targetPort: 8080
