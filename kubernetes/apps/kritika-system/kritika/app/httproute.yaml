---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kritika
spec:
  hostnames:
    - kritika.homeops.ca
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        # Full-proxy Authentik first, then Kritika's native admin login.
        - name: authentik-server
          namespace: auth
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kritika-webhook
  annotations:
    # A rejected unsigned POST proves this intentionally private-dashboard boundary.
    gatus.home-operations.com/endpoint: |-
      path: /hooks/github
      method: POST
      body: '{}'
      headers:
        Content-Type: application/json
        X-GitHub-Event: ping
      conditions: ["[STATUS] == 401"]
spec:
  hostnames:
    - kritika.homeops.ca
  parentRefs:
    - name: envoy-external
      namespace: network
  rules:
    - matches:
        - method: POST
          path:
            type: Exact
            value: /hooks/github
      backendRefs:
        - name: kritika-policy
          port: 8081
