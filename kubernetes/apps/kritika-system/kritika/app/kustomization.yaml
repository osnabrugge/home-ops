---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kritika-system
resources:
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./policy-deployment.yaml
  - ./ciliumnetworkpolicy.yaml
  - ./httproute.yaml
configMapGenerator:
  - name: kritika-policy-code
    files:
      - policy.py
generatorOptions:
  disableNameSuffixHash: true
