---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kritika-embeddings
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ceph-block
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kritika-embeddings
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: kritika-embeddings
  ports:
    - name: http
      port: 11434
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kritika-embeddings
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kritika-embeddings
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kritika-embeddings
    spec:
      automountServiceAccountToken: false
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ollama
          image: docker.io/ollama/ollama:0.40.14@sha256:ebaef4f4c5d93660e1f25f8ad085a112f51ccfb0e8458073e71793959dba91c9
          args: [serve]
          env:
            - name: HOME
              value: /tmp
            - name: OLLAMA_HOST
              value: 0.0.0.0:11434
            - name: OLLAMA_MODELS
              value: /models
            - name: OLLAMA_NUM_PARALLEL
              value: "1"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
            - name: OLLAMA_KEEP_ALIVE
              value: 5m
            - name: OLLAMA_CONTEXT_LENGTH
              value: "512"
            - name: OLLAMA_NOHISTORY
              value: "true"
            - name: OLLAMA_NO_CLOUD
              value: "true"
            - name: OLLAMA_MAX_QUEUE
              value: "8"
          ports:
            - name: http
              containerPort: 11434
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            exec:
              command: [ollama, list]
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            exec:
              command: [ollama, list]
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [ollama, list]
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 1500m
              memory: 1Gi
              ephemeral-storage: 256Mi
          volumeMounts:
            - name: models
              mountPath: /models
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: kritika-embeddings
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
