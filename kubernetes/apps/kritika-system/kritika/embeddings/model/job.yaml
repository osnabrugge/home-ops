---
apiVersion: batch/v1
kind: Job
metadata:
  name: kritika-embeddings-granite-30m-v1
  annotations:
    # This initializes a retained cache; routine image updates do not rerun it.
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kritika-embeddings-bootstrap
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pull
          image: docker.io/ollama/ollama:0.40.14@sha256:ebaef4f4c5d93660e1f25f8ad085a112f51ccfb0e8458073e71793959dba91c9
          args: [pull, "granite-embedding:30m"]
          env:
            - name: OLLAMA_HOST
              value: http://kritika-embeddings.kritika-system.svc.cluster.local:11434
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
              ephemeral-storage: 16Mi
            limits:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
