---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kritika-embeddings
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kritika-embeddings
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: kritika
            app.kubernetes.io/instance: kritika
            app.kubernetes.io/component: server
        - matchLabels:
            app.kubernetes.io/name: kritika-embeddings-bootstrap
      toPorts:
        - ports:
            - port: "11434"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # Download model weights only; no external inference endpoint is permitted.
    - toFQDNs:
        - matchName: registry.ollama.ai
        - matchPattern: "*.r2.cloudflarestorage.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kritika-embeddings-bootstrap
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kritika-embeddings-bootstrap
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchName: kritika-embeddings.kritika-system.svc.cluster.local
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: kritika-embeddings
      toPorts:
        - ports:
            - port: "11434"
              protocol: TCP
