---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app pve-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    controllers:
      pve-exporter:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: ghcr.io/prometheus-pve/prometheus-pve-exporter
              tag: 3.11.0@sha256:290756c34fd13e1d9972b8e64344d49a15ab99dd0053b29d9716f1ca4ae4c069
            args: ["--config.file=/etc/prometheus/pve.yml"]
            env:
              PYTHONWARNINGS: once
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 10m
                memory: 50Mi
              limits:
                memory: 200Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: *app
        ports:
          metrics:
            protocol: HTTP
            port: 9221
    serviceMonitor:
      app:
        serviceName: *app
        endpoints:
          - port: metrics
            scheme: http
            path: /pve
            params:
              module: [pve01]
              target:
                - pve01.in.homeops.ca:8006
            interval: 60s
            scrapeTimeout: 30s
            relabelings:
              - targetLabel: instance
                replacement: pve01
            metricRelabelings:
              - action: labeldrop
                regex: (pod)
          - port: metrics
            scheme: http
            path: /pve
            params:
              module: [pve02]
              target:
                - pve02.in.homeops.ca:8006
            interval: 60s
            scrapeTimeout: 30s
            relabelings:
              - targetLabel: instance
                replacement: pve02
            metricRelabelings:
              - action: labeldrop
                regex: (pod)
    persistence:
      config:
        type: secret
        name: pve-exporter-secret
        globalMounts:
          - path: /etc/prometheus/pve.yml
            subPath: pve.yml
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
