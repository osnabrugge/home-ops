---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pve-exporter
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: azurekv
  target:
    name: pve-exporter-secret
    template:
      data:
        pve.yml: |
          pve01:
            user: {{ .PVE01_USER | toJson }}
            token_name: {{ .PVE01_TOKEN_NAME | toJson }}
            token_value: {{ .PVE01_TOKEN_VALUE | toJson }}
            verify_ssl: true
          pve02:
            user: {{ .PVE02_USER | toJson }}
            token_name: {{ .PVE02_TOKEN_NAME | toJson }}
            token_value: {{ .PVE02_TOKEN_VALUE | toJson }}
            verify_ssl: true
  dataFrom:
    - extract:
        key: pve-exporter-hosts
