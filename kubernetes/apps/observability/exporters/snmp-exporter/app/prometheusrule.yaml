---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: snmp-exporter-rules
spec:
  groups:
    - name: snmp-exporter.rules
      rules:
        # upsBasicOutputStatus is the authoritative on/off-mains signal (2=onLine
        # 3=onBattery 7=off). The old expr used upsBasicBatteryTimeOnBattery_seconds
        # > 60, but that metric is TimeTicks passed through as a raw gauge, so its
        # unit is hundredths of a second -- "60" meant 0.6s, and the real 5 minute
        # delay came from the for: clause.
        #
        # for: 30s is one scrape interval of confirmation (SNMP is scraped every
        # 30s), so a momentary flicker cannot page but a genuine outage surfaces
        # within 30-60s. Alerting faster than that requires lowering the scrape
        # interval, not lowering this value.
        - alert: UPSOnBattery
          expr: upsBasicOutputStatus{job="snmp-exporter"} == 3
          annotations:
            summary: >-
              UPS {{ $labels.target }} is running on battery
            description: >-
              Mains power lost. Estimated runtime remaining:
              {{ with printf "upsAdvBatteryRunTimeRemaining{instance='%s'}" $labels.instance | query }}{{ . | first | value | humanizeDuration }}{{ end }}.
          for: 30s
          labels:
            severity: critical

        # Driven by install date vs recommended age on the card, not by measured
        # capacity -- so it fires at 100% capacity. Both packs are genuinely overdue
        # (ups01 replaced 2022-07-05, ups02 2022-03-24, recommendation 42 months).
        - alert: UPSReplaceBattery
          expr: upsAdvBatteryReplaceIndicator == 2
          annotations:
            summary: >-
              UPS {{ $labels.target }} battery is past its recommended service life
            description: >-
              The UPS reports the battery should be replaced. It still holds charge,
              but runtime will keep shrinking -- which directly reduces the shutdown
              budget during an outage.
          for: 5m
          labels:
            severity: critical

        # instance is set from __param_target by the ServiceMonitor relabeling, so
        # it is an IP, never a hostname. The previous instance=~"pdu.*" matched no
        # series at all and this alert could never fire.
        #
        # The friendly "target" label (pdu01/pdu02) exists on the scraped SNMP
        # metrics but NOT on up{}, so matching by address is required here.
        - alert: PDUUnreachable
          expr: 'up{job="snmp-exporter", instance=~"192\\.168\\.99\\.(15|16)"} == 0'
          annotations:
            summary: >-
              PDU {{ $labels.instance }} is unreachable via SNMP
            description: >-
              PDU {{ $labels.instance }} has been unreachable for 5 minutes.
              Power control and monitoring unavailable.
          for: 5m
          labels:
            severity: warning

        # Same dead-matcher bug as PDUUnreachable: instance is an IP, not "ups01".
        - alert: UPSUnreachable
          expr: 'up{job="snmp-exporter", instance=~"192\\.168\\.99\\.(11|12)"} == 0'
          annotations:
            summary: >-
              UPS {{ $labels.instance }} is unreachable via SNMP
            description: >-
              UPS {{ $labels.instance }} has been unreachable for 5 minutes.
              Power monitoring unavailable.
          for: 5m
          labels:
            severity: warning

        # Replaces a capacity<50 for:10m rule that was unfirable: ups01 holds only
        # ~24 min at current load, so 50% is reached around minute 12 and the 10m
        # hold would expire after the batteries already had. Runtime remaining is
        # the number that actually matters for a shutdown decision.
        #
        # upsAdvBatteryRunTimeRemaining is TimeTicks exported as a raw gauge:
        # hundredths of a second, so /6000 converts to minutes.
        - alert: UPSLowRuntime
          expr: |
            (upsAdvBatteryRunTimeRemaining / 6000) < 5
              and on (instance) upsBasicOutputStatus == 3
          annotations:
            summary: >-
              UPS {{ $labels.target }} has under 5 minutes of runtime left
            description: >-
              On battery with {{ $value | printf "%.1f" }} minutes remaining.
              Shut workloads down now.
          labels:
            severity: critical

        # Degraded battery health while still on mains: runtime should be tens of
        # minutes at idle, so a low figure here means the pack is failing.
        - alert: UPSRuntimeDegraded
          expr: |
            (upsAdvBatteryRunTimeRemaining / 6000) < 10
              and on (instance) upsBasicOutputStatus == 2
          annotations:
            summary: >-
              UPS {{ $labels.target }} runtime is degraded ({{ $value | printf "%.1f" }} min on mains)
            description: >-
              Still on mains, but estimated runtime is under 10 minutes. Battery
              is ageing or the load has grown.
          for: 30m
          labels:
            severity: warning

        - alert: UPSHighLoad
          # upsAdvOutputLoad is already a load percentage (0-100). The previous
          # expr divided centi-watt power by watt rated power -> ~100x inflated
          # -> fired at any load. Use the native load % instead.
          expr: upsAdvOutputLoad > 80
          annotations:
            summary: >-
              UPS {{ $labels.target }} load is high ({{ $value | humanize }}%)
            description: >-
              UPS is running at over 80% capacity. Consider load balancing.
          for: 15m
          labels:
            severity: warning
