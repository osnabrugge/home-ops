---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: speedtest-exporter
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  # Grafana.com 13665 revision 4, with runtime datasource lookup (upstream GPL-3.0).
  # Operator datasourceName substitution is literal; a name is not a datasource UID.
  configMapRef:
    name: speedtest-exporter-dashboard
    key: speedtest-exporter.json
