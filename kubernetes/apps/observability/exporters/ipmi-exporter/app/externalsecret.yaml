---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ipmi-exporter
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: azurekv
  target:
    name: ipmi-exporter-secret
    template:
      data:
        # ipmi_exporter has no env-var substitution, so ESO renders the whole
        # config file and it is mounted directly — credentials never hit git.
        ipmi.yml: |
          modules:
            default:
              user: "{{ .IPMI_USER }}"
              pass: "{{ .IPMI_PASS }}"
              driver: "LAN_2_0"
              privilege: "operator"
              timeout: 10000
              collectors:
                - bmc
                - ipmi
                - chassis
                - sel
              # dcmi omitted on purpose: this Supermicro BMC does not implement
              # DCMI power reporting, so the collector only ever returned
              # ipmi_up{collector="dcmi"}=0 plus per-scrape error log spam.
  dataFrom:
    - extract:
        key: ipmi-exporter
