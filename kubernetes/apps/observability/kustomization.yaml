---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability

components:
  - ../../components/alerts
  - ../../components/kopiur/secret

resources:
  - ./namespace.yaml
  - ./alert-triage/ks.yaml
  - ./exporters
  - ./gatus-sidecar/ks.yaml
  - ./grafana-operator/ks.yaml
  - ./kromgo/ks.yaml
  - ./kube-prometheus-stack/ks.yaml
  # NUT deliberately does NOT live in this cluster. In an outage the cluster must
  # shut down BEFORE nas01, which serves it NFS — so the orchestrator cannot be a
  # workload that dies with the cluster. It runs on nas01, which already ships the
  # snmp-ups driver the container image lacks. snmp-exporter covers UPS metrics.
  - ./prometheus-adapter/ks.yaml
  - ./radar/ks.yaml
  - ./silence-operator/ks.yaml
  - ./netbox-operator/ks.yaml
  - ./netbox/ks.yaml
  - ./netbox-diode/ks.yaml
  - ./victoria-logs/ks.yaml
