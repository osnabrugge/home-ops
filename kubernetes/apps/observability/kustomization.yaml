---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability

components:
  - ../../components/alerts
  - ../../components/kopiur/secret

resources:
  - ./namespace.yaml
  - ./alert-triage/ks.yaml
  - ./exporters
  - ./gatus-sidecar/ks.yaml
  - ./grafana-operator/ks.yaml
  - ./kromgo/ks.yaml
  - ./kube-prometheus-stack/ks.yaml
  # network-ups-tools is DISABLED: ghcr.io/jr0dd/network-ups-tools ships only
  # serial/USB drivers and has no snmp-ups binary, so it cannot talk to the
  # RMCARD-equipped CyberPower units at all. snmp-exporter already covers the
  # metrics; re-enable only with an image built --with-snmp.
  # - ./network-ups-tools/ks.yaml
  - ./prometheus-adapter/ks.yaml
  - ./radar/ks.yaml
  - ./silence-operator/ks.yaml
  - ./netbox-operator/ks.yaml
  - ./netbox/ks.yaml
  - ./netbox-diode/ks.yaml
  - ./victoria-logs/ks.yaml
