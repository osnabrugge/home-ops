---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radar
spec:
  chartRef:
    kind: OCIRepository
    name: radar
  interval: 1h
  values:
    replicaCount: 1
    image:
      pullPolicy: IfNotPresent
    serviceAccount:
      create: true
    rbac:
      create: true
      podLogs: true
      metrics: true
      viewRBAC: true
      viewWebhooks: true
    mcp:
      enabled: true
    auth:
      mode: none
    service:
      port: 9280
    traffic:
      prometheusUrl: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
    timeline:
      storage: sqlite
      dbPath: /data/timeline.db
      retention: 720h
      maxSize: 800Mi
    persistence:
      enabled: true
      accessMode: ReadWriteOnce
      size: 2Gi
      storageClassName: ceph-block
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 200m
        memory: 1Gi
