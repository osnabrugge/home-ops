---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radar
spec:
  chartRef:
    kind: OCIRepository
    name: radar
  interval: 1h
  values:
    replicaCount: 1
    image:
      pullPolicy: IfNotPresent
    allowedHosts:
      - radar.homeops.ca
    trustedOrigins:
      - https://radar.homeops.ca
    auth:
      mode: proxy
      existingSecret: radar-auth-secret
      proxy:
        userHeader: X-Authentik-Username
        # App access is restricted by Authentik; its slug is a stable role claim.
        # Directory groups use pipes, while Radar's proxy parser expects commas.
        groupsHeader: X-Authentik-Meta-App
        logoutURL: https://radar.homeops.ca/outpost.goauthentik.io/sign_out
    crdGroups:
      all: true # get/list/watch on every API group and resource, including Secrets
    mcp:
      enabled: true
    rbac:
      create: true
      podExec: true
      portForward: true
      secrets: true
      viewNodeRuntime: true
      viewRBAC: true
      viewWebhooks: true
    serviceAccount:
      create: true
    service:
      port: 9280
    traffic:
      prometheusUrl: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
    timeline:
      storage: sqlite
      dbPath: /data/timeline.db
      retention: 720h
      maxSize: 800Mi
    persistence:
      enabled: true
      accessMode: ReadWriteOnce
      size: 2Gi
      storageClassName: ceph-block
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        # 200m throttled the container 88.58% of the time after the 1.14.1 upgrade;
        # it indexes the whole cluster, so it is bursty rather than steady-state.
        cpu: "1"
        memory: 2Gi
