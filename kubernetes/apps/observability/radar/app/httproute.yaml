---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radar
  annotations:
    gatus.home-operations.com/endpoint: |
      url: https://radar.homeops.ca/api/health
      conditions:
        - "[STATUS] == 200"
spec:
  # Authentik owns authentication; Radar authorizes each identity through RBAC.
  hostnames:
    - radar.homeops.ca
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        - name: authentik-server
          port: 80
          namespace: auth
