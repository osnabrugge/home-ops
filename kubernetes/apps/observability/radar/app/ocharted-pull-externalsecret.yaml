---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ocharted-pull
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: azurekv
  target:
    name: ocharted-pull
    template:
      # Lets the OCIRepository authenticate instead of depending on ocharted's
      # 10.42.0.0/16 bypass, which only works for in-cluster socket peers.
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: >-
          {"auths":{"ocharted.homeops.ca":{"username":"{{ .OCHARTED_USERNAME }}","password":"{{ .OCHARTED_PASSWORD }}","auth":"{{ printf "%s:%s" .OCHARTED_USERNAME .OCHARTED_PASSWORD | b64enc }}"}}}
  dataFrom:
    - extract:
        key: ocharted
