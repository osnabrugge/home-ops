---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: radar
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  # Pin by tag only. Do NOT add a digest: ocharted serves this manifest by tag
  # (200) but returns MANIFEST_UNKNOWN (404) for digest-addressed fetches, so a
  # pinned digest makes the OCIRepository permanently unready.
  ref:
    tag: 1.12.2
  # HTTPS hostname (now served by envoy-internal), not the plain-HTTP Service:
  # flate maps spec.insecure to TLS InsecureSkipVerify rather than to plain HTTP,
  # so an http:// Service URL fails every PR with
  # "http: server gave HTTP response to HTTPS client".
  url: oci://ocharted.homeops.ca/skyhook-io.github.io/helm-charts/radar
