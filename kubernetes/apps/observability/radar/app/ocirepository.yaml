---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: radar
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  # Pin by tag only. Do NOT add a digest: ocharted serves this manifest by tag
  # (200) but returns MANIFEST_UNKNOWN (404) for digest-addressed fetches, so a
  # pinned digest makes the OCIRepository permanently unready.
  ref:
    tag: 1.12.2
  # In-cluster Service, not ocharted.homeops.ca: the public hostname routes back
  # in via envoy-external, so ocharted's auth bypassNetworks (10.42.0.0/16) never
  # matches the caller and every pull returns 401.
  insecure: true
  url: oci://ocharted.kube-system.svc.cluster.local:8080/skyhook-io.github.io/helm-charts/radar
