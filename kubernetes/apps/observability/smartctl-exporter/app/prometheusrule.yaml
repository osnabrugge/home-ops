---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: smartctl-exporter-rules
spec:
  groups:
    - name: smartctl-exporter.rules
      rules:
        - alert: SmartDeviceHighTemperature
          expr: |-
            smartctl_device_temperature{temperature_type="current"} > 65
          for: 5m
          annotations:
            summary: >-
              Mounted drive {{ $labels.device }} on device {{ $labels.instance }} has a temperature higher than 65°C
          labels:
            severity: critical

        - alert: SmartDeviceTestFailed
          expr: |-
            (smartctl_device_smart_status != 1 or smartctl_device_status != 1)
          for: 5m
          annotations:
            summary: >-
              Mounted drive {{ $labels.device }} on device {{ $labels.instance }} did not pass its SMART test
          labels:
            severity: critical

        - alert: SmartDeviceCriticalWarning
          expr: |-
            smartctl_device_critical_warning != 0
          for: 5m
          annotations:
            summary: >-
              Mounted drive {{ $labels.device }} on device {{ $labels.instance }} is in a critical state
          labels:
            severity: critical

        - alert: SmartDeviceMediaErrors
          expr: |-
            smartctl_device_media_errors != 0
          for: 5m
          annotations:
            summary: >-
              Mounted drive {{ $labels.device }} on device {{ $labels.instance }} has media errors
          labels:
            severity: critical

        - alert: SmartDeviceAvailableSpareUnderThreshold
          expr: |-
            smartctl_device_available_spare_threshold > smartctl_device_available_spare
          for: 5m
          annotations:
            summary: >-
              Device {{ $labels.device }} on instance {{ $labels.instance }} is under available spare threshold
          labels:
            severity: critical

        - alert: SmartDeviceInterfaceSlow
          expr: |-
            smartctl_device_interface_speed{speed_type="current"} != on(device, instance, namespace, pod) smartctl_device_interface_speed{speed_type="max"}
          annotations:
            summary: >-
              Device {{ $labels.device }} on instance {{ $labels.instance }} interface is slower then it should be
          for: 5m
          labels:
            severity: critical

        # TrueNAS 25.10 removed smartd and every smart.* middleware method, so nas01
        # schedules its own self-tests from cron and publishes the outcome through the
        # node-exporter textfile collector. Without these two rules a failed self-test
        # would only ever exist in the drive's own log.
        - alert: Nas01SmartSelfTestFailed
          expr: |-
            nas01_smart_selftest_failed == 1
          for: 5m
          annotations:
            summary: >-
              nas01 drive {{ $labels.device }} ({{ $labels.model }} {{ $labels.serial }}) failed its most recent SMART self-test
          labels:
            severity: critical

        - alert: Nas01SmartSelfTestStale
          expr: |-
            time() - nas01_smart_selftest_report_timestamp_seconds > 14400
          for: 15m
          annotations:
            summary: >-
              nas01 has not published SMART self-test results for over 4h — the cron job or smartctl is broken
          labels:
            severity: warning
