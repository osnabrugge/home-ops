---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: network-ups-tools
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: network-ups-tools
  values:
    controllers:
      network-ups-tools:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          annotations:
            configmap.reloader.stakater.com/reload: &config network-ups-tools-config
        containers:
          app:
            image:
              repository: ghcr.io/jr0dd/network-ups-tools
              tag: v2.8.3@sha256:9f8e14d155c6ef05940cee6f8861e259e951eb11750aeddd02539d986dac1ca0
            env:
              TZ: America/Toronto
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 128Mi
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 3493
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  failureThreshold: 5
              readiness: *probe
    service:
      app:
        type: LoadBalancer
        annotations:
          # Must sit inside the Cilium LB pool (192.168.69.0/24) or it never gets allocated.
          lbipam.cilium.io/ips: 192.168.69.133
        ports:
          http:
            port: 3493
            protocol: TCP
    persistence:
      config:
        type: configMap
        name: *config
        globalMounts:
          - path: /etc/nut
            readOnly: true
      # upsd/upsmon need a writable state dir; the config mount is read-only.
      run:
        type: emptyDir
        globalMounts:
          - path: /var/run/nut
