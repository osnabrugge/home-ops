# ups01 is a CyberPower PR1500RT2UN (shipped with an RMCARD), ups02 a
# PR1500RT2U (RMCARD bought separately). Both are reached through their
# RMCARD205 management cards. Addressed by IP on purpose, NOT by hostname:
# during a power event gw01/DNS may already be down, and snmp-ups(8) warns
# that name resolution at shutdown time is a known failure mode. This is the
# same dependency that stranded k8s06 on 2026-09-28.
#
# community/version below are VERIFIED working against both cards (2026-10-04)
# and match what snmp-exporter already uses; `public` does NOT work.
#
# RMCARD205 is not named in the NUT HCL (it lists RMCARD100/201/202/301), so
# the cyberpower mapping is a best guess; if either driver fails to start,
# switch that section to `mibs = auto` and let sysObjectID detection pick.

[ups01]
    driver = snmp-ups
    port = 192.168.99.11
    mibs = cyberpower
    community = public_v2
    snmp_version = v2c
    pollfreq = 15
    desc = "CyberPower PR1500RT2UN - rack feed A"

[ups02]
    driver = snmp-ups
    port = 192.168.99.12
    mibs = cyberpower
    community = public_v2
    snmp_version = v2c
    pollfreq = 15
    desc = "CyberPower PR1500RT2U - rack feed B"
