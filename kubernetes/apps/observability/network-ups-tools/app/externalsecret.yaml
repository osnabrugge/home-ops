---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: network-ups-tools
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: azurekv
  target:
    name: network-ups-tools-config
    template:
      data:
        ups.conf: |
          pollinterval = 5

          [ups01]
              driver = snmp-ups
              port = 192.168.99.11
              snmp_version = v2c
              community = {{ .UPS_SNMP_COMMUNITY | toJson }}
              mibs = auto
              pollfreq = 15
              snmp_retries = 0
              snmp_timeout = 2
              sdorder = -1

          [ups02]
              driver = snmp-ups
              port = 192.168.99.12
              snmp_version = v2c
              community = {{ .UPS_SNMP_COMMUNITY | toJson }}
              mibs = auto
              pollfreq = 15
              snmp_retries = 0
              snmp_timeout = 2
              sdorder = -1
        upsd.conf: |
          LISTEN 127.0.0.1 3493
          MAXAGE 45
          STATEPATH /run/nut
        # No authenticated command or shutdown authority is provisioned.
        upsd.users: ""
  dataFrom:
    - extract:
        key: network-ups-tools
