---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbox-diode-plugin
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: azurekv
  target:
    name: netbox-diode-plugin-config
    template:
      data:
        diode.yaml: |
          PLUGINS_CONFIG:
            netbox_diode_plugin:
              diode_target: grpc://netbox-diode.observability.svc.cluster.local:8080/diode
              netbox_to_diode_client_id: {{ .NETBOX_TO_DIODE_CLIENT_ID | toJson }}
              netbox_to_diode_client_secret: {{ .NETBOX_TO_DIODE_CLIENT_SECRET | toJson }}
  dataFrom:
    - extract:
        key: netbox-diode
