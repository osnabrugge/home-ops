---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netbox
spec:
  chartRef:
    kind: OCIRepository
    name: netbox
  interval: 1h
  values:
    updateStrategy:
      type: Recreate
    worker:
      updateStrategy:
        type: Recreate
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - netbox
                  - key: app.kubernetes.io/component
                    operator: NotIn
                    values:
                      - worker
              topologyKey: kubernetes.io/hostname
    # NetBox v4.7 removed the `housekeeping` management command ("Unknown command:
    # 'housekeeping'"); the worker's built-in scheduler runs these tasks now.
    housekeeping:
      enabled: false
    # NetBox leaks ~17 MiB/h across its 4 granian workers: the pod sits at ~1050 MiB
    # fresh, climbs to the ceiling in ~28h, gets OOMKilled, and repeats. Verified as a
    # clean sawtooth in Prometheus (1063->1445, 1102->1431, 1060->1485, each ending in
    # a drop back to ~1050). The chart's `resourcesPreset: medium` caps it at 1536Mi,
    # which is a generic Bitnami preset, not a NetBox-derived number.
    #
    # Raising the limit alone only moves the OOM later, so the leak is dealt with at
    # source: granian respawns a worker once it exceeds max-rss, or every 12h, reusing
    # the remaining workers meanwhile so there is no request-visible restart.
    # `resources` is set explicitly because it makes the chart ignore resourcesPreset.
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        memory: 2Gi
    extraEnvs:
      - name: GRANIAN_WORKERS_LIFETIME # 12h, seconds
        value: "43200"
      - name: GRANIAN_WORKERS_MAX_RSS # MiB per worker; fresh worker is ~280
        value: "420"
      - name: GRANIAN_RSS_SAMPLES # 3 x 30s sustained, so a transient spike is ignored
        value: "3"
    allowedHosts:
      - netbox.homeops.ca
      - netbox.observability.svc.cluster.local
    timeZone: America/Toronto
    remoteAuth:
      enabled: true
      backends:
        - netbox.authentication.LDAPBackend
      ldap:
        serverUri: ldap://lldap.auth.svc.cluster.local:3890
        startTls: false
        userDnTemplate: "uid=%(user)s,ou=people,dc=homeops,dc=ca"
        bindDn: "uid=netbox,ou=people,dc=homeops,dc=ca"
        groupSearchBaseDn: "ou=groups,dc=homeops,dc=ca"
        groupSearchClass: groupOfNames
        groupType: GroupOfNamesType
        requireGroupDn: []
        isAdminDn:
          - "cn=admins,ou=groups,dc=homeops,dc=ca"
        isSuperUserDn:
          - "cn=admins,ou=groups,dc=homeops,dc=ca"
        findGroupPerms: true
        mirrorGroups: true
        attrFirstName: givenName
        attrLastName: sn
        attrMail: mail
    existingSecret: netbox-secret
    superuser:
      existingSecret: netbox-secret
    postgresql:
      enabled: false
    externalDatabase:
      host: postgres16-rw.database.svc.cluster.local
      port: 5432
      database: netbox
      username: netbox
      existingSecretName: netbox-secret
      existingSecretKey: postgresql-password
      options:
        sslmode: disable
        target_session_attrs: read-write
    valkey:
      enabled: false
    tasksDatabase:
      host: dragonfly-netbox.database.svc.cluster.local
      port: 6379
      database: 0
      existingSecretName: netbox-secret
      existingSecretKey: tasks-password
    cachingDatabase:
      host: dragonfly-netbox.database.svc.cluster.local
      port: 6379
      database: 1
      existingSecretName: netbox-secret
      existingSecretKey: cache-password
    persistence:
      enabled: true
      existingClaim: netbox
    httpRoute:
      enabled: true
      hostnames:
        - netbox.homeops.ca
      parentRefs:
        - name: envoy-internal
          namespace: network
    ingress:
      enabled: false
