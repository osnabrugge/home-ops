---
alerting:
  pushover:
    application-token: ${BUDDY_PUSHOVER_TOKEN}
    default-alert:
      description: health-check failed
      failure-threshold: 3
      minimum-reminder-interval: 1h
      send-on-resolved: true
      success-threshold: 2
    priority: 1
    resolved-priority: 0
    title: Gatus
    user-key: ${BUDDY_PUSHOVER_USER_KEY}

endpoints:
  # Removed the "Ping" check (icmp://${BUDDY_DDNS_HOSTNAME}). It could never
  # pass: it targeted our own WAN IP, the firewall drops echo requests, and
  # reaching it from inside would need hairpin NAT. A DNS-based replacement was
  # tried and is also permanently red -- as of 2026-09-02 the DDNS hostname has
  # no A record at all (empty answer from 1.1.1.1, 8.8.8.8 and cluster DNS), so
  # the DDNS registration itself is dead. Status Page below already covers
  # reachability. Re-add a DNS check here if the DDNS record is ever restored.
  - name: Status Page
    group: buddy
    url: https://${BUDDY_STATUS_HOSTNAME}
    interval: 1m
    ui:
      hide-url: true
      hide-hostname: true
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: pushover

external-endpoints:
  - name: Heartbeat
    group: buddy
    token: ${BUDDY_HEARTBEAT_TOKEN}
    heartbeat:
      interval: 5m
    alerts:
      - type: pushover
