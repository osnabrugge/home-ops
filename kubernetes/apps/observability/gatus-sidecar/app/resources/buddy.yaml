---
alerting:
  pushover:
    application-token: ${BUDDY_PUSHOVER_TOKEN}
    default-alert:
      description: health-check failed
      failure-threshold: 3
      minimum-reminder-interval: 1h
      send-on-resolved: true
      success-threshold: 2
    priority: 1
    resolved-priority: 0
    title: Gatus
    user-key: ${BUDDY_PUSHOVER_USER_KEY}

endpoints:
  # ICMP to our own WAN IP can never pass: the firewall drops echo requests and
  # reaching it from inside would need hairpin NAT. Query the DDNS name against
  # a public resolver instead -- this proves the DDNS updater is alive and still
  # publishing an A record, which is what the ping was really watching.
  - name: DDNS
    group: buddy
    url: 1.1.1.1
    dns:
      query-name: ${BUDDY_DDNS_HOSTNAME}
      query-type: A
    interval: 5m
    ui:
      hide-url: true
      hide-hostname: true
    conditions:
      - "[DNS_RCODE] == NOERROR"
      - "len([BODY]) > 6"
    alerts:
      - type: pushover

  - name: Status Page
    group: buddy
    url: https://${BUDDY_STATUS_HOSTNAME}
    interval: 1m
    ui:
      hide-url: true
      hide-hostname: true
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: pushover

external-endpoints:
  - name: Heartbeat
    group: buddy
    token: ${BUDDY_HEARTBEAT_TOKEN}
    heartbeat:
      interval: 5m
    alerts:
      - type: pushover
