---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netbox-diode
spec:
  chartRef:
    kind: OCIRepository
    name: netbox-diode
  interval: 1h
  values:
    controllers:
      gateway:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/library/nginx
              tag: 1.29.3@sha256:2f4e10193b0c4f61472245e9d26cea78e7df7af266c7e7cf5e67353ee2731b51
            command: [nginx, -c, /etc/diode/nginx.conf, -g, "daemon off;"]
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
      # Ory Hydra database migration job — must complete before hydra starts
      hydra-migrate:
        type: job
        containers:
          migrate:
            image:
              repository: oryd/hydra
              tag: v26.2.0
            # -e reads the DSN from env (DSN var), --yes auto-confirms the migration
            command: [hydra, migrate, sql, up, -e, --yes]
            env:
              DSN:
                valueFrom:
                  secretKeyRef:
                    name: netbox-diode-secret
                    key: HYDRA_DSN
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

      # Ory Hydra — OAuth2 server backing diode-auth
      hydra:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: oryd/hydra
              tag: v26.2.0
            command: [hydra, serve, all, --dev]
            env:
              TZ: America/Toronto
              DSN:
                valueFrom:
                  secretKeyRef:
                    name: netbox-diode-secret
                    key: HYDRA_DSN
              URLS_SELF_ISSUER: http://netbox-diode-hydra.observability.svc.cluster.local:4444
              STRATEGIES_ACCESS_TOKEN: jwt
              STRATEGIES_JWT_SCOPE_CLAIM: list
              OIDC_SUBJECT_IDENTIFIERS_SUPPORTED_TYPES: public
              SECRETS_SYSTEM:
                valueFrom:
                  secretKeyRef:
                    name: netbox-diode-secret
                    key: HYDRA_SECRETS_SYSTEM
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/alive
                    port: 4445
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/ready
                    port: 4445
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  failureThreshold: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi

      # Diode Auth — wraps Hydra, manages OAuth2 clients for agent authentication
      diode-auth:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          auth-clients:
            image:
              repository: docker.io/library/python
              tag: 3.15-slim@sha256:65a65fc7b30b06cb6df4930fd4650697cb23f4c2698ab81fc87e4b031bc36928
            command: [python, /bootstrap/auth-bootstrap.py]
            env:
              HYDRA_ADMIN_URL: http://netbox-diode-hydra.observability.svc.cluster.local:4445
              HYDRA_TOKEN_URL: http://netbox-diode-hydra.observability.svc.cluster.local:4444/oauth2/token
              DIODE_INGEST_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: netbox-diode-secret
                    key: DIODE_INGEST_CLIENT_ID
              DIODE_INGEST_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: netbox-diode-secret
                    key: DIODE_INGEST_CLIENT_SECRET
              DIODE_TO_NETBOX_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: netbox-diode-secret
                    key: DIODE_TO_NETBOX_CLIENT_ID
              DIODE_TO_NETBOX_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: netbox-diode-secret
                    key: DIODE_TO_NETBOX_CLIENT_SECRET
              NETBOX_TO_DIODE_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: netbox-diode-secret
                    key: NETBOX_TO_DIODE_CLIENT_ID
              NETBOX_TO_DIODE_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: netbox-diode-secret
                    key: NETBOX_TO_DIODE_CLIENT_SECRET
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 250m
                memory: 128Mi
        containers:
          app:
            image:
              repository: netboxlabs/diode-auth
              tag: 2.4.0
            env:
              TZ: America/Toronto
              HTTP_PORT: &auth-port 8082
              OAUTH2_PUBLIC_SERVER_URL: http://netbox-diode-hydra.observability.svc.cluster.local:4444
              OAUTH2_ADMIN_SERVER_URL: http://netbox-diode-hydra.observability.svc.cluster.local:4445
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *auth-port
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *auth-port
                  periodSeconds: 10
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi

      # Diode Ingester — gRPC endpoint accepting network device data into Redis streams
      diode-ingester:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: netboxlabs/diode-ingester
              tag: 2.4.0
            env:
              TZ: America/Toronto
              REDIS_HOST: dragonfly-diode.database.svc.cluster.local
              REDIS_PORT: "6379"
              REDIS_USERNAME: ""
              REDIS_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: netbox-diode-secret
                    key: REDIS_PASSWORD
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8081
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8081
                  periodSeconds: 10
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8081
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi

      # Diode Reconciler — reads Redis streams and reconciles data with NetBox
      diode-reconciler:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: netboxlabs/diode-reconciler
              tag: 2.4.0
            env:
              TZ: America/Toronto
              REDIS_HOST: dragonfly-diode.database.svc.cluster.local
              REDIS_PORT: "6379"
              REDIS_USERNAME: ""
              REDIS_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: netbox-diode-secret
                    key: REDIS_PASSWORD
              NETBOX_DIODE_PLUGIN_API_BASE_URL: http://netbox.observability.svc.cluster.local/api/plugins/diode
              # SKIP_TLS_VERIFY=false means TLS verification is enabled (not skipped).
              # Communication uses plain HTTP internally, so this is a safe no-op default.
              NETBOX_DIODE_PLUGIN_SKIP_TLS_VERIFY: "false"
              DIODE_AUTH_TOKEN_URL: http://netbox-diode-hydra.observability.svc.cluster.local:4444/oauth2/token
              DIODE_TO_NETBOX_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: netbox-diode-secret
                    key: DIODE_TO_NETBOX_CLIENT_ID
              DIODE_TO_NETBOX_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: netbox-diode-secret
                    key: DIODE_TO_NETBOX_CLIENT_SECRET
              POSTGRES_HOST: postgres16-rw.database.svc.cluster.local
              POSTGRES_PORT: "5432"
              POSTGRES_DB_NAME: diode
              POSTGRES_USER:
                valueFrom:
                  secretKeyRef:
                    name: netbox-diode-secret
                    key: POSTGRES_USER
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: netbox-diode-secret
                    key: POSTGRES_PASSWORD
              MIGRATION_ENABLED: "true"
              LOGGING_LEVEL: INFO
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8081
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8081
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8081
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      gateway:
        controller: gateway
        primary: true
        forceRename: netbox-diode
        ports:
          http:
            port: 8080
      hydra:
        controller: hydra
        ports:
          public:
            port: 4444
          admin:
            port: 4445
          introspect:
            port: 4434
      diode-auth:
        controller: diode-auth
        ports:
          http:
            port: *auth-port
      diode-ingester:
        controller: diode-ingester
        ports:
          grpc:
            port: 8081
      diode-reconciler:
        controller: diode-reconciler
        ports:
          grpc:
            port: 8081

    persistence:
      gateway-config:
        type: configMap
        name: netbox-diode-gateway
        advancedMounts:
          gateway:
            app:
              - path: /etc/diode
                readOnly: true
      auth-bootstrap:
        type: configMap
        name: netbox-diode-auth-bootstrap
        advancedMounts:
          diode-auth:
            auth-clients:
              - path: /bootstrap
                readOnly: true
      tmp:
        type: emptyDir
        advancedMounts:
          gateway:
            app:
              - path: /tmp
          diode-auth:
            app:
              - path: /tmp
          diode-ingester:
            app:
              - path: /tmp
          diode-reconciler:
            app:
              - path: /tmp
          hydra:
            app:
              - path: /tmp
          hydra-migrate:
            migrate:
              - path: /tmp
