---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./hydra-networkpolicy.yaml
  - ./ocirepository.yaml
configMapGenerator:
  - name: netbox-diode-auth-bootstrap
    files:
      - auth-bootstrap.py
generatorOptions:
  disableNameSuffixHash: true
