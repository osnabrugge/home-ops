pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events {}
http {
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    upstream diode_auth {
        server netbox-diode-diode-auth.observability.svc.cluster.local:8082;
    }
    upstream diode_ingester {
        server netbox-diode-diode-ingester.observability.svc.cluster.local:8081;
    }
    upstream diode_reconciler {
        server netbox-diode-diode-reconciler.observability.svc.cluster.local:8081;
    }
    server {
        listen 8080;
        http2 on;
        server_name _;
        client_max_body_size 25m;

        location = /healthz {
            access_log off;
            return 200;
        }
        location = /auth/introspect {
            internal;
            proxy_method POST;
            proxy_pass http://diode_auth/introspect;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Original-URI $request_uri;
        }
        location /diode/auth/ {
            rewrite ^/diode/auth/(.*)$ /$1 break;
            proxy_pass http://diode_auth;
        }
        location /diode/diode.v1.IngesterService/ {
            auth_request /auth/introspect;
            rewrite ^/diode/(.*)$ /$1 break;
            grpc_pass grpc://diode_ingester;
        }
        location /diode/diode.v1.ReconcilerService/ {
            auth_request /auth/introspect;
            rewrite ^/diode/(.*)$ /$1 break;
            grpc_pass grpc://diode_reconciler;
        }
        location / {
            return 404;
        }
    }
}
