---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: netbox-diode-database-credentials
spec:
  dependsOn:
    - name: azurekv
      namespace: external-secrets
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: diode-db-user
      namespace: database
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: hydra-db-user
      namespace: database
  interval: 1h
  path: ./kubernetes/apps/observability/netbox-diode/database/credentials
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: database
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: netbox-diode-database
spec:
  dependsOn:
    - name: cloudnative-pg-cluster
      namespace: database
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Database
      name: diode
      namespace: database
    - apiVersion: postgresql.cnpg.io/v1
      kind: Database
      name: hydra
      namespace: database
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Database
      current: status.applied == true
  interval: 1h
  path: ./kubernetes/apps/observability/netbox-diode/database
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: database
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: netbox-diode
spec:
  dependsOn:
    - name: netbox
    - name: netbox-diode-database
  interval: 1h
  path: ./kubernetes/apps/observability/netbox-diode/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: observability
  wait: false
