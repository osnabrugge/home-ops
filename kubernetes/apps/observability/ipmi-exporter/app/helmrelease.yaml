---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ipmi-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    controllers:
      ipmi-exporter:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: quay.io/prometheuscommunity/ipmi-exporter
              tag: v1.10.1
            args:
              - --config.file=/etc/ipmi_exporter/ipmi.yml
              - --web.listen-address=:9290
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: *app
        ports:
          http:
            port: 9290
    persistence:
      # freeipmi shells out and needs scratch space for lock/state files; without a
      # writable /tmp every collector fails instantly with "read-only file system".
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      config:
        type: secret
        name: ipmi-exporter-secret
        globalMounts:
          - path: /etc/ipmi_exporter/ipmi.yml
            subPath: ipmi.yml
            readOnly: true
