---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafana_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  labels:
    dashboards: grafana
spec:
  config:
    analytics:
      check_for_updates: "false"
      check_for_plugin_updates: "false"
      feedback_links_enabled: "false"
      reporting_enabled: "false"
    auth:
      disable_login_form: "false"
      # The private Authentik scope preserves existing subjects, not email links.
      oauth_allow_insecure_email_lookup: "false"
    auth.anonymous:
      enabled: "true"
    auth.generic_oauth:
      enabled: "true"
      name: Authentik
      icon: signin
      client_id: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_ID}
      client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
      scopes: openid profile email grafana_legacy_subject
      empty_scopes: "false"
      auth_url: https://authentik.homeops.ca/application/o/authorize/
      token_url: https://authentik.homeops.ca/application/o/token/
      api_url: https://authentik.homeops.ca/application/o/userinfo/
      signout_redirect_url: https://authentik.homeops.ca/application/o/grafana/end-session/
      login_attribute_path: preferred_username
      groups_attribute_path: groups
      name_attribute_path: name
      use_pkce: "true"
      validate_id_token: "true"
      jwk_set_url: https://authentik.homeops.ca/application/o/grafana/jwks/
      # Keep existing Grafana roles; changing IdP group names must not change grants.
      skip_org_role_sync: "true"
      allow_assign_grafana_admin: "false"
      auto_login: "false"
    log:
      mode: console
    metrics:
      enabled: "true"
    news:
      news_feed_enabled: "false"
    plugins:
      plugin_admin_enabled: "false"
    security:
      angular_support_enabled: "true"
    server:
      enable_gzip: "true"
      root_url: https://grafana.homeops.ca
  deployment:
    spec:
      strategy:
        type: Recreate
      template:
        spec:
          containers:
            - name: grafana
              env:
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-admin-password-secret
                      key: GF_SECURITY_ADMIN_PASSWORD
                - name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: grafana-oidc
                      key: client-id
                - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: grafana-oidc
                      key: client-secret
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
            # Keep Grafana's native HTTP probe and require durable PVC writes too.
            - name: storage-ready
              image: docker.io/library/python:3.15-slim@sha256:08a4c22c92b79ec821a7ad49768480039ee5b7accac3955228e75366e30abc8e
              command:
                - python3
                - -c
                - |
                  import signal
                  import sys

                  signal.signal(signal.SIGTERM, lambda *_: sys.exit(0))
                  signal.pause()
              env:
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
              readinessProbe:
                exec:
                  command:
                    - python3
                    - -c
                    - |
                      import fcntl
                      import os
                      import tempfile

                      with open("/var/lib/grafana/.storage-readiness.lock", "a") as lock:
                          fcntl.flock(lock.fileno(), fcntl.LOCK_EX | fcntl.LOCK_NB)
                          with tempfile.TemporaryFile(dir="/var/lib/grafana") as stream:
                              stream.write(b"ready")
                              stream.flush()
                              os.fsync(stream.fileno())
                periodSeconds: 30
                timeoutSeconds: 5
                failureThreshold: 2
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: grafana-data
                  mountPath: /var/lib/grafana
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          volumes:
            - name: grafana-data
              persistentVolumeClaim:
                claimName: grafana-pvc
  httpRoute:
    spec:
      hostnames:
        - grafana.homeops.ca
      parentRefs:
        - name: envoy-internal
          namespace: network
  persistentVolumeClaim:
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
      storageClassName: ceph-block
  disableDefaultSecurityContext: All
