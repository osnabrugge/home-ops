---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: azurekv
  target:
    name: grafana-oidc
    template:
      data:
        client-id: "{{ .GRAFANA_AUTHENTIK_CLIENT_ID }}"
        client-secret: "{{ .GRAFANA_OAUTH_CLIENT_SECRET }}"
        legacy-subjects: "{{ .GRAFANA_OAUTH_LEGACY_SUBJECTS }}"
  dataFrom:
    - extract:
        key: grafana
