---
apiVersion: authentik.starry.blue/v1alpha1
kind: AuthentikApplication
metadata:
  name: grafana
spec:
  slug: grafana
  name: Grafana
  deletionPolicy: Retain
  # Adopt the existing application/provider; never create a second Grafana client.
  adopt: IfMatch
  provider:
    flows:
      authorization:
        slug: default-provider-authorization-implicit-consent
      invalidation:
        slug: default-provider-invalidation-flow
    oauth2:
      clientType: Confidential
      redirectURIs:
        - url: https://grafana.homeops.ca/login/generic_oauth
          matchingMode: Strict
      scopes:
        - scopeName: openid
        - scopeName: profile
        - scopeName: email
        - scopeName: grafana_legacy_subject
      grantTypes:
        - AuthorizationCode
      subjectMode: HashedUserID
      issuerMode: PerProvider
      includeClaimsInIDToken: true
      signingKey:
        name: authentik Self-signed Certificate
      credentials:
        secretRef:
          name: grafana-oidc
  access:
    mode: Any
    rules:
      - group:
          name: authentik Admins
      - user:
          username: sean
