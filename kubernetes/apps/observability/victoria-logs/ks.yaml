---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: victoria-logs
spec:
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  path: ./kubernetes/apps/observability/victoria-logs/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: observability
  wait: false
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: victoria-logs-collector
spec:
  dependsOn:
    - name: victoria-logs
  interval: 1h
  path: ./kubernetes/apps/observability/victoria-logs/collector
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: observability
  wait: false
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: victoria-logs-identity
spec:
  dependsOn:
    - name: authentik-operator
      namespace: auth
  healthChecks:
    - apiVersion: authentik.starry.blue/v1alpha1
      kind: AuthentikApplication
      name: victoria-logs
      namespace: auth
  healthCheckExprs:
    - apiVersion: authentik.starry.blue/v1alpha1
      kind: AuthentikApplication
      current: has(status.conditions) && status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
  interval: 1h
  path: ./kubernetes/apps/observability/victoria-logs/identity
  postBuild:
    substitute:
      AUTHENTIK_APP: victoria-logs
      AUTHENTIK_TITLE: VictoriaLogs
      AUTHENTIK_HOST: vlogs.homeops.ca
      AUTHENTIK_BACKEND_NAMESPACE: observability
      AUTHENTIK_BACKEND_SERVICE: victoria-logs
      AUTHENTIK_BACKEND_PORT: "9428"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: auth
