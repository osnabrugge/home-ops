---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: omada-exporter
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: azurekv
  target:
    name: omada-exporter-secret
    template:
      data:
        OMADA_USER: "{{ .username }}"
        OMADA_PASS: "{{ .password }}"
        OMADA_SITE: "{{ .site }}"
  dataFrom:
    - extract:
        key: omada-exporter
