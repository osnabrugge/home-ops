---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/tuppr.home-operations.com/talosupgrade_v1alpha1.json
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: talos
spec:
  talos:
    # renovate: datasource=custom.talos-factory depName=siderolabs/talos
    version: v1.14.2
  policy:
    rebootMode: powercycle
    # Without this, nodes power-cycle with krbd sessions still open; the OSD
    # sockets die mid-IO (-ESHUTDOWN) and ext4 flips every RBD volume on the
    # node to emergency_ro, which never self-heals across container restarts.
    waitForVolumeDetach: true
  healthChecks:
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: Snapshot
      expr: |-
        status.phase != 'Running'
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: Restore
      expr: |-
        !(status.phase in ['Resolving', 'Restoring'])
    - apiVersion: ceph.rook.io/v1
      kind: CephCluster
      # A bare HEALTH_OK match parks the rollout forever on warnings that carry no
      # data risk. Ceph 20.2.4 Tentacle added four cephx key-type checks
      # (AUTH_EMERGENCY_CIPHERS_SET, AUTH_INSECURE_CLIENT_KEY_TYPE,
      # AUTH_INSECURE_KEYS_ALLOWED, AUTH_INSECURE_KEYS_CREATABLE) that are still
      # firing for the prior-generation .1 keys kept by keepPriorKeyCountMax, and
      # clearing them means touching the keys that caused the 2026-10-01 RBD
      # outage. Accept HEALTH_WARN only while every reported check is an AUTH_ one
      # — anything real (OSD_DOWN, PG_DEGRADED, MON_DOWN, ...) still blocks.
      expr: |-
        status.ceph.health == 'HEALTH_OK' || status.ceph.details.all(k, k.startsWith('AUTH_'))
