---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tuppr
spec:
  chartRef:
    kind: OCIRepository
    name: tuppr
  interval: 1h
  values:
    replicaCount: 2
    talos:
      # Chart default is talos.default.svc.cluster.local, a Service this cluster
      # does not have; without this every upgrade job dies with
      # "error creating etcd client: context deadline exceeded".
      endpoints:
        - 192.168.42.51
        - 192.168.42.52
        - 192.168.42.53
    monitoring:
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            dashboards: grafana
