---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: nas01
spec:
  allowedNamespaces:
    all: true
  backend:
    s3:
      auth:
        secretRef:
          name: kopiur-repository-secret
          namespace: kopiur-system
      # Existing repository (46.6 GiB of history) lives in default-bucket/home-ops/.
      # The empty `kopiur` bucket has no key grant; switching to it would start a
      # brand-new repository. Migrate data first if renaming the bucket.
      bucket: default-bucket
      endpoint: nas01.in.homeops.ca:9000
      prefix: home-ops/
      region: us-east-1
      tls:
        disableTls: true
  encryption:
    passwordSecretRef:
      name: kopiur-repository-secret
      namespace: kopiur-system
      key: KOPIA_PASSWORD
  maintenance:
    schedule:
      quick:
        cron: 0 * * * *
        jitter: 10m
      full:
        cron: 0 3 * * *
        jitter: 1h
  moverDefaults:
    cache:
      # Every cache PVC is 5Gi or larger (KOPIUR_CAPACITY default). Kopia's own
      # defaults are 5000 MiB per budget, larger than the whole PVC, so the
      # sweeper never runs and the cache fills the volume. The metadata budget
      # applies twice: kopia caps the index-blobs cache at the same size.
      contentCacheSizeMb: 512
      metadataCacheSizeMb: 1024
  parameters:
    epoch:
      minDuration: 1h
  scheduleDefaults:
    timezone: America/Toronto
