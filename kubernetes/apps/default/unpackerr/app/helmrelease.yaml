---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unpackerr
spec:
  chartRef:
    kind: OCIRepository
    name: unpackerr
  interval: 1h
  values:
    controllers:
      unpackerr:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/unpackerr/unpackerr
              tag: v1.0.0@sha256:21c6bfa4f4c86ab2dd0232da0dfb3ed4c5d929e42e09894e7b4d2154d0c144f6
            env:
              TZ: America/Toronto
              UN_LOG_FILE: /config/unpackerr.log
              UN_LOG_FILES: "3"
              UN_LOG_FILE_MB: "5"
              UN_KEEP_HISTORY: "400"
              UN_WEBSERVER_LISTEN_ADDR: 0.0.0.0:5656
              UN_WEBSERVER_METRICS: "true"
              UN_WEBSERVER_UI_PASSWORD: webauth:X-Authentik-Username
              UN_WEBSERVER_UI_ROLE_HEADER: X-Authentik-Groups
              UN_WEBSERVER_UPSTREAMS_0: 10.42.0.0/16
              # Unpackerr tokenizes the existing "authentik Admins" group header.
              # This role can inspect behavior but cannot change settings or queues.
              UN_WEBSERVER_ROLES_Admins_PERMISSIONS_0: system:stats:read
              UN_WEBSERVER_ROLES_Admins_PERMISSIONS_1: system:info:read
              UN_WEBSERVER_ROLES_Admins_PERMISSIONS_2: system:queue:read
              UN_WEBSERVER_ROLES_Admins_PERMISSIONS_3: system:history:read
              UN_WEBSERVER_ROLES_Admins_PERMISSIONS_4: system:logs:read
              UN_WEBSERVER_ROLES_metrics_PERMISSIONS_0: system:metrics:read
              UN_WEBSERVER_API_KEYS_0_NAME: prometheus
              UN_WEBSERVER_API_KEYS_0_ROLES_0: metrics
              # Lidarr
              UN_LIDARR_0_URL: http://lidarr.default.svc.cluster.local
              UN_LIDARR_0_PATHS_0: /data/downloads/torrents/complete
              UN_LIDARR_0_PROTOCOLS: torrent
              UN_LIDARR_0_TIMEOUT: 10s
              UN_LIDARR_0_DELETE_DELAY: 5m
              UN_LIDARR_0_DELETE_ORIG: false
              # Radarr
              UN_RADARR_0_URL: http://radarr.default.svc.cluster.local
              UN_RADARR_0_PATHS_0: /data/downloads/torrents/complete/movies
              UN_RADARR_0_PROTOCOLS: torrent
              UN_RADARR_0_TIMEOUT: 10s
              UN_RADARR_0_DELETE_DELAY: 5m
              UN_RADARR_0_DELETE_ORIG: false
              # Sonarr
              UN_SONARR_0_URL: http://sonarr.default.svc.cluster.local
              UN_SONARR_0_PATHS_0: /data/downloads/torrents/complete/tv
              UN_SONARR_0_PROTOCOLS: torrent
              UN_SONARR_0_TIMEOUT: 10s
              UN_SONARR_0_DELETE_DELAY: 5m
              UN_SONARR_0_DELETE_ORIG: false
            envFrom:
              - secretRef:
                  name: unpackerr-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: 5656
    serviceMonitor:
      app:
        endpoints:
          - port: http
            path: /metrics
            interval: 60s
            scrapeTimeout: 15s
            authorization:
              type: Bearer
              credentials:
                name: unpackerr-secret
                key: UN_WEBSERVER_API_KEYS_0_KEY
    persistence:
      config:
        existingClaim: unpackerr
        globalMounts:
          - path: /config
      media:
        type: nfs
        server: nas02.in.homeops.ca
        path: /volume1/data
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
