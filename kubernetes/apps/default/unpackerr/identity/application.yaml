---
apiVersion: authentik.starry.blue/v1alpha1
kind: AuthentikApplication
metadata:
  name: unpackerr
spec:
  slug: unpackerr
  name: Unpackerr
  group: Media
  deletionPolicy: Retain
  adopt: Never
  provider:
    flows:
      authorization:
        slug: default-provider-authorization-implicit-consent
      invalidation:
        slug: default-provider-invalidation-flow
    proxy:
      proxy:
        externalHost: https://unpackerr.homeops.ca
        internalHost: http://unpackerr.default.svc.cluster.local:5656
      outpost:
        name: authentik Embedded Outpost
  access:
    mode: Any
    rules:
      - group:
          name: authentik Admins
