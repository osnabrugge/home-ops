---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: matter-server
spec:
  chartRef:
    kind: OCIRepository
    name: matter-server
  interval: 1h
  values:
    controllers:
      matter-server:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        initContainers:
          thread-routes:
            image:
              repository: docker.io/library/busybox
              tag: "1.38"
            # These unsafe sysctls must be set in the pod namespace, not by kubelet.
            command:
              - sysctl
              - -w
              - net.ipv6.conf.net1.accept_ra=2
              - net.ipv6.conf.net1.accept_ra_rt_info_max_plen=64
            securityContext:
              runAsNonRoot: false
              runAsUser: 0
              privileged: true
        containers:
          app:
            image:
              repository: ghcr.io/matter-js/matterjs-server
              tag: 1.5.4@sha256:b7f4f6c888ece6214a0720ab68c3a46654c71c6d34d01ef1850095d210c0615b
            env:
              PORT: &port 5580
              LOG_LEVEL: info
              NODE_OPTIONS: --max-old-space-size=768
              TZ: America/Toronto
            args:
              - --storage-path=/data
              - --primary-interface=net1
              - --production-mode
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 10
                  failureThreshold: 30
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      # Attach to the IoT VLAN (VLAN70) so the Matter stack shares L2 with the
      # SLZB OTBR (otbr01, wired) and Matter devices, matching the zigbee/HA pattern.
      annotations:
        k8s.v1.cni.cncf.io/networks: |-
          [{
            "name": "iot",
            "namespace": "kube-system",
            "ips": ["192.168.70.21/24"],
            "mac": "c6:07:27:af:fb:54"
          }]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["{{ .Release.Name }}.homeops.ca"]
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: "{{ .Release.Name }}"
                port: *port
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
