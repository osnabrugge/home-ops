---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: eufy-bridge
spec:
  chartRef:
    kind: OCIRepository
    name: eufy-bridge
  interval: 1h
  values:
    controllers:
      eufy-bridge:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/mega-yfue/ha-eufy-sdk-bridge
              tag: 0.7.2@sha256:b9bb59b2040960998873926a90763921167b13538eaa015b8ce2fb4fc226f29c
            env:
              EUFY_COUNTRY: CA
              BRIDGE_PORT: &port 3000
              GO2RTC_RTSP_PORT: &rtsp_port 8554
            envFrom:
              - secretRef:
                  name: eufy-bridge
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  timeoutSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                cpu: 100m
                memory: 1Gi
    defaultPodOptions:
      # Attach to the IoT VLAN (VLAN70) to keep on same VLAN as Eufy devices
      annotations:
        k8s.v1.cni.cncf.io/networks: |-
          [{
            "name": "iot",
            "namespace": "kube-system",
            "ips": ["192.168.70.23/24"],
            "mac": "c6:07:27:af:fb:56"
          }]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        ports:
          http:
            port: *port
          rtsp:
            port: *rtsp_port
    route:
      app:
        hostnames: ["{{ .Release.Name }}.homeops.ca"]
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: "{{ .Release.Name }}"
                port: *port
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /app/data
      tmp:
        type: emptyDir
