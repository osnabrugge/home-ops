---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: eufy-bridge
spec:
  components:
    # Provision the fresh claim and protect the new fabric with scheduled backups.
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: home-assistant
      namespace: default
    - name: multus-networks
      namespace: kube-system
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  path: ./kubernetes/apps/default/eufy-bridge/app
  postBuild:
    substitute:
      APP: eufy-bridge
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: false
