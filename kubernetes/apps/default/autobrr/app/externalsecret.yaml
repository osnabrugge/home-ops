---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: autobrr-oidc
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: azurekv
  target:
    name: autobrr-oidc
    deletionPolicy: Retain
    template:
      data:
        client-id: "{{ .OIDC_CLIENT_ID }}"
        client-secret: "{{ .OIDC_CLIENT_SECRET }}"
        allowed-subject: "{{ .OIDC_ALLOWED_SUBJECT }}"
  dataFrom:
    - extract:
        key: autobrr-oidc
