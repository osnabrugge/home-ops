---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otbr
spec:
  chartRef:
    kind: OCIRepository
    name: otbr
  interval: 1h
  values:
    controllers:
      app:
        # Held at 0: NETWORK_DEVICE 192.168.70.36:6638 (the otbr01/zig01 coordinator
        # socket) is not listening, so the container can never pass its liveness probe.
        # It had accumulated 85 restarts in one night. Restore to 1 once the device is
        # reflashed and 6638 answers. The otbr-data PVC is deliberately left in place —
        # it holds the Thread network dataset.
        replicas: 0
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: |
              [{
                "name": "iot",
                "namespace": "kube-system",
                "ips": ["192.168.70.22/24"],
                "mac": "c6:07:27:af:fb:55"
              }]
        containers:
          app:
            image:
              repository: ghcr.io/wittdennis/homeassistant-otbr
              tag: 4.2.5@sha256:282f840612d953438bb07fac95cb9932067b3b26b56ba653587459f63126a4e1
            env:
              BACKBONE_IF: net1
              BAUDRATE: "460800"
              FIREWALL: "0"
              NAT64: "1"
              NETWORK_DEVICE: "192.168.70.36:6638"
              S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES: 1
              S6_READ_ONLY_ROOT: 1
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                add:
                  - NET_ADMIN
                  - NET_RAW
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 512Mi
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /node/state
                    port: &port 8081
              readiness: *probe
    service:
      app:
        ports:
          http:
            port: *port
    persistence:
      data:
        existingClaim: otbr-data
        globalMounts:
          - path: /data
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /run
            subPath: run
      tun:
        type: hostPath
        hostPath: /dev/net/tun
        hostPathType: CharDevice
        globalMounts:
          - path: /dev/net/tun
