---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: frigate
spec:
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: node-feature-discovery-rules
      namespace: kube-system
    - name: intel-gpu-resource-driver
      namespace: kube-system
  interval: 1h
  path: ./kubernetes/apps/default/frigate/app
  postBuild:
    substitute:
      APP: frigate
      # Frigate writes .jwt_secret as root:1000 mode 0600, so the uid-1000 mover
      # cannot read that one file. Backing up as root does NOT work: the nas02 NFS
      # export uses root_squash, so a uid-0 mover gets "permission denied" on /repo
      # itself. Instead keep the default uid-1000 mover and let kopia skip the file
      # it cannot read -- frigate regenerates .jwt_secret on start if it is missing.
      KOPIUR_IGNORE_FILE_ERRORS: "true"
      KOPIUR_SUSPEND: "true"
      KOPIUR_CAPACITY: 5Gi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: false
