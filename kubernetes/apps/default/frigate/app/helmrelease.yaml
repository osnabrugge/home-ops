---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frigate
spec:
  chartRef:
    kind: OCIRepository
    name: frigate
  interval: 1h
  values:
    controllers:
      frigate:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          nodeSelector:
            google.feature.node.kubernetes.io/coral: "true"
            node.kubernetes.io/gpu: "true"
        initContainers:
          init-config:
            image:
              repository: ghcr.io/blakeblackshear/frigate
              tag: 0.18.2
            command:
              - python3
              - -c
              - |
                import os
                from pathlib import Path
                import secrets
                import shutil
                import stat

                shutil.copyfile("/config-src/config.yml", "/config/config.yml")
                path = Path("/config/.jwt_secret")
                try:
                    info = path.lstat()
                except FileNotFoundError:
                    value = secrets.token_hex(64)
                    fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
                    with os.fdopen(fd, "w") as stream:
                        stream.write(value)
                        stream.flush()
                        os.fsync(stream.fileno())
                    info = path.lstat()
                if not stat.S_ISREG(info.st_mode) or info.st_size == 0:
                    raise RuntimeError("JWT secret must be a non-empty regular file")
                os.chown(path, 1000, 1000, follow_symlinks=False)
                os.chmod(path, 0o600, follow_symlinks=False)
                print("Frigate configuration and private JWT ownership prepared")
        containers:
          app:
            image:
              repository: ghcr.io/blakeblackshear/frigate
              tag: 0.18.2
            env:
              TZ: America/Toronto
              LIBVA_DRIVER_NAME: iHD
            envFrom:
              - secretRef:
                  name: frigate-secret
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/version
                    port: &port 5000
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 60
                  periodSeconds: 10
            securityContext:
              privileged: true
            resources:
              claims:
                - name: gpu
              requests:
                cpu: 200m
                memory: 1Gi
              limits:
                memory: 4Gi
    defaultPodOptions:
      securityContext:
        supplementalGroups:
          - 1000
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: frigate
    service:
      app:
        ports:
          http:
            port: *port
          rtsp:
            port: 8554
          webrtc:
            port: 8555
          webrtc-udp:
            port: 8555
            protocol: UDP
    route:
      app:
        hostnames: ["{{ .Release.Name }}.homeops.ca"]
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /config
      config-src:
        type: configMap
        identifier: config
        globalMounts:
          - path: /config-src/config.yml
            subPath: config.yml
            readOnly: true
      cache:
        type: emptyDir
        medium: Memory
        sizeLimit: 2Gi
        globalMounts:
          - path: /tmp/cache
      shm:
        # Frigate needs >=114MB /dev/shm for two 1080p cameras; default is 64MB.
        type: emptyDir
        medium: Memory
        sizeLimit: 256Mi
        globalMounts:
          - path: /dev/shm
      media:
        type: nfs
        server: nas01.in.homeops.ca
        path: /mnt/backups/frigate
        globalMounts:
          - path: /media/frigate
      usb:
        type: hostPath
        hostPath: /dev/bus/usb
        hostPathType: Directory
        globalMounts:
          - path: /dev/bus/usb
    configMaps:
      config:
        enabled: true
        data:
          config.yml: |
            mqtt:
              enabled: true
              host: mosquitto.default.svc.cluster.local
              port: 1883
              topic_prefix: frigate
              client_id: frigate
            detectors:
              coral:
                type: edgetpu
                device: usb
            ffmpeg:
              hwaccel_args: preset-vaapi
            objects:
              track:
                - person
                - car
                - dog
                - cat
            record:
              enabled: true
              motion:
                days: 7
              alerts:
                retain:
                  days: 14
                  mode: motion
              detections:
                retain:
                  days: 14
                  mode: motion
            snapshots:
              enabled: true
              retain:
                default: 14
            # go2rtc restreams each camera ONCE (Frigate best practice). Detect,
            # record and live view all consume the local restream (rtsp://127.0.0.1:8554)
            # so each EmpireTech/Dahua camera only sees a single RTSP session — important
            # for the PTZ domes, which limit concurrent streams. subtype=0 = main;
            # All three cameras use subtype=2 for 1280x720 detection. Frigate substitutes
            # {FRIGATE_RTSP_PASSWORD} (from frigate-secret) across the whole config incl.
            # this go2rtc block. User `viewer`; percent-encode the pw in Key Vault if it
            # ever contains RTSP-reserved chars (@ : / ? # & % =).
            go2rtc:
              streams:
                cam01:
                  - rtsp://viewer:{FRIGATE_RTSP_PASSWORD}@192.168.70.71:554/cam/realmonitor?channel=1&subtype=0
                cam01_sub:
                  - rtsp://viewer:{FRIGATE_RTSP_PASSWORD}@192.168.70.71:554/cam/realmonitor?channel=1&subtype=2
                cam02:
                  - rtsp://viewer:{FRIGATE_RTSP_PASSWORD}@192.168.70.72:554/cam/realmonitor?channel=1&subtype=0
                cam02_sub:
                  - rtsp://viewer:{FRIGATE_RTSP_PASSWORD}@192.168.70.72:554/cam/realmonitor?channel=1&subtype=2
                cam03:
                  - rtsp://viewer:{FRIGATE_RTSP_PASSWORD}@192.168.70.73:554/cam/realmonitor?channel=1&subtype=0
                cam03_sub:
                  - rtsp://viewer:{FRIGATE_RTSP_PASSWORD}@192.168.70.73:554/cam/realmonitor?channel=1&subtype=2
            cameras:
              cam01:
                ffmpeg:
                  inputs:
                    - path: rtsp://127.0.0.1:8554/cam01
                      input_args: preset-rtsp-restream
                      roles: [record]
                    - path: rtsp://127.0.0.1:8554/cam01_sub
                      input_args: preset-rtsp-restream
                      roles: [detect]
                # Pin the measured substream dimensions to skip the OpenCV auto-probe
                # (that probe blocks startup for 30s per stream if a source stalls).
                detect:
                  enabled: true
                  width: 1280
                  height: 720
                  fps: 5
                # Plain :80 — the web UI 302s to 443 but /onvif/device_service does not.
                # cam02/cam03 return 403 here and need ONVIF enabled before they get a block.
                onvif:
                  host: 192.168.70.71
                  port: 80
                  user: viewer
                  password: "{FRIGATE_RTSP_PASSWORD}"
              cam02:
                ffmpeg:
                  inputs:
                    - path: rtsp://127.0.0.1:8554/cam02
                      input_args: preset-rtsp-restream
                      roles: [record]
                    - path: rtsp://127.0.0.1:8554/cam02_sub
                      input_args: preset-rtsp-restream
                      roles: [detect]
                detect:
                  enabled: true
                  width: 1280
                  height: 720
                  fps: 5
              cam03:
                ffmpeg:
                  inputs:
                    - path: rtsp://127.0.0.1:8554/cam03
                      input_args: preset-rtsp-restream
                      roles: [record]
                    - path: rtsp://127.0.0.1:8554/cam03_sub
                      input_args: preset-rtsp-restream
                      roles: [detect]
                detect:
                  enabled: true
                  width: 1280
                  height: 720
                  fps: 5
            # cam04 (192.168.70.74): still boxed / not deployed.
            version: 0.17-0
