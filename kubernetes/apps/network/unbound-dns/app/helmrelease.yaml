---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app unbound-dns
spec:
  chartRef:
    kind: OCIRepository
    name: unbound-dns
  interval: 1h
  values:
    fullnameOverride: *app
    provider:
      name: webhook
      webhook:
        image:
          repository: ghcr.io/guillomep/external-dns-unbound-webhook
          tag: v0.1.5@sha256:50e3e7f038cf4a77b9f1fe175176ae4780ad753c9466471e6449596f37477501
        env:
          - name: UNBOUND_HOST
            value: tcp://192.168.42.1:953
          - name: UNBOUND_CA_PEM_PATH
            value: /certs/unbound_server.pem
          - name: UNBOUND_CERT_PEM_PATH
            value: /certs/unbound_control.pem
          - name: UNBOUND_KEY_PEM_PATH
            value: /certs/unbound_control.key
        extraVolumeMounts:
          - name: unbound-certs
            mountPath: /certs
            readOnly: true
        livenessProbe:
          httpGet:
            path: /healthz
            port: http-webhook
          initialDelaySeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: http-webhook
          initialDelaySeconds: 10
          timeoutSeconds: 5
    extraVolumes:
      - name: unbound-certs
        secret:
          secretName: &secret unbound-dns-secret
    extraArgs:
      # Without this it also ingests envoy-external routes, producing conflicting
      # record candidates for dual-published hosts ("discarding CNAME record").
      - --gateway-name=envoy-internal
    triggerLoopOnEvent: true
    policy: sync
    sources:
      - gateway-httproute
      - service
    txtOwnerId: main
    txtPrefix: k8s.main.%{record_type}-
    domainFilters:
      - homeops.ca
    serviceMonitor:
      # Replaced by ./servicemonitor.yaml — the chart also scrapes the webhook port,
      # which does not serve /metrics. See that file for the full explanation.
      enabled: false
    podAnnotations:
      secret.reloader.stakater.com/reload: *secret
