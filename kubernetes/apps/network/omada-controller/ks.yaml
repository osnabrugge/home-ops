---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: omada-controller-identity
spec:
  # No dependency on Authentik: the blueprint must exist before its pods mount it.
  healthChecks:
    - apiVersion: v1
      kind: ConfigMap
      name: omada-controller-authentik
      namespace: auth
  interval: 1h
  path: ./kubernetes/apps/network/omada-controller/identity
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: auth
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: omada-controller
spec:
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: omada-db
      namespace: database
    - name: multus-networks
      namespace: kube-system
  interval: 1h
  path: ./kubernetes/apps/network/omada-controller/app
  postBuild:
    substitute:
      APP: omada-controller
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: network
  wait: false
