---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: omada-controller
spec:
  chartRef:
    kind: OCIRepository
    name: omada-controller
  interval: 1h
  values:
    controllers:
      omada-controller:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          lan-route:
            image:
              repository: docker.io/library/busybox
              tag: "1.38"
            # Keep LAN discovery local and prefer attached subnets over SBR's source default.
            command:
              - sh
              - -ec
              - |
                ip -4 route replace 192.168.0.0/24 dev net1 src 192.168.0.30
                ip -4 rule add priority 100 to 192.168.0.0/24 lookup main
                ip -4 rule add priority 101 to 192.168.99.0/24 lookup main
                ip -4 rule add priority 102 to 192.168.50.0/24 lookup main
            securityContext:
              runAsNonRoot: false
              runAsUser: 0
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
                add: ["NET_ADMIN"]
        containers:
          app:
            image:
              repository: docker.io/mbentley/omada-controller
              tag: beta-6.3.0.111@sha256:f894278f72980ceb57f7fea6b785a990c2317b10758d4ef827236f98d148f6ab
            env:
              ROOTLESS: "true"
              MANAGE_HTTP_PORT: &http_port "8088"
              MANAGE_HTTPS_PORT: &https_port "8043"
              PORTAL_HTTP_PORT: "8080"
              PORTAL_HTTPS_PORT: "8843"
              UPGRADE_HTTPS_PORT: "8043"
              PORT_APP_DISCOVERY: "27001"
              PORT_ADOPT_V1: "29812"
              PORT_UPGRADE_V1: "29813"
              PORT_MANAGER_V1: "29811"
              PORT_MANAGER_V2: "29814"
              PORT_DISCOVERY: "29810"
              PORT_TRANSFER_V2: "29815"
              PORT_RTTY: "29816"
              PORT_DEVICE_MONITOR: "29817"
              WEB_CONFIG_OVERRIDE: "false"
              SHOW_SERVER_LOGS: "true"
              SHOW_MONGODB_LOGS: "false"
              SKIP_USERMOD: "true"
              MONGO_EXTERNAL: "true"
              # honor envoy X-Forwarded-Proto so the 443 route serves instead of 302 -> :8043
              APPLICATION_PROPERTIES: server.forward-headers-strategy=framework
              TZ: America/Toronto
            envFrom:
              - secretRef:
                  name: omada-controller-secret
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8088
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 60
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 2Gi
    defaultPodOptions:
      annotations:
        # LAN attach (bond0.1 / VLAN1) so Omada is L2-reachable for device discovery + adoption.
        # Management attach (bond0.99 / VLAN99) is where the Omada devices actually hold their
        # management IPs (192.168.99.21/.22), so adoption traffic needs to originate there.
        # Guest attach (bond0.50 / VLAN50) so EAPs serving the guest SSID can
        # reach the controller for discovery and the guest portal.
        k8s.v1.cni.cncf.io/networks: |-
          [
            {"name": "lan", "namespace": "kube-system", "ips": ["192.168.0.30/24"]},
            {"name": "management", "namespace": "kube-system", "ips": ["192.168.99.30/24"]},
            {"name": "guest", "namespace": "kube-system", "ips": ["192.168.50.30/24"]}
          ]
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 192.168.69.130
        externalTrafficPolicy: Local
        ports:
          http:
            port: *http_port
          https:
            port: *https_port
          discovery:
            port: 29810
            protocol: UDP
          manager:
            port: 29811
          adopt:
            port: 29812
          upgrade:
            port: 29813
          transfer:
            port: 29814
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            # Keep DNS-only monitoring; backend access is restricted cross-namespace.
            # Guarded probes use public DNS, not this private split-horizon zone.
            guarded: false
            url: kube-dns.kube-system.svc.cluster.local
            dns:
              query-name: omada-controller.homeops.ca
              query-type: A
            conditions:
              - "[DNS_RCODE] == NOERROR"
              - "[BODY] == 192.168.69.121"
        hostnames:
          - "{{ .Release.Name }}.homeops.ca"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: https
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /opt/tplink/EAPController/data
      logs:
        type: emptyDir
        globalMounts:
          - path: /opt/tplink/EAPController/logs
      # mbentley entrypoint imports /cert/tls.{crt,key} into the Jetty keystore so
      # 8043 serves the LE wildcard cert Envoy can validate (see BackendTLSPolicy).
      cert:
        type: secret
        name: homeops-ca-tls
        globalMounts:
          - path: /cert
            readOnly: true
