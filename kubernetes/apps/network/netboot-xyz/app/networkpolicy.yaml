---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: netboot-xyz
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: netboot-xyz
      app.kubernetes.io/name: netboot-xyz
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - port: 3000
          protocol: TCP
    - ports:
        - port: 69
          protocol: UDP
        - port: 80
          protocol: TCP
