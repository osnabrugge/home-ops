---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=home-operations/flate
  FLATE_VERSION: "0.7.0"
  # renovate: datasource=custom.talos-factory depName=siderolabs/talos
  TALOS_VERSION: v1.14.5

jobs:
  filter:
    if: ${{ github.event_name == 'pull_request' }}
    name: Image Pull - Filter
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      any-changed: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Get Changed Files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: kubernetes/**

  extract:
    if: >-
      ${{
        needs.filter.outputs.any-changed == 'true' &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    needs: filter
    name: Image Pull - Extract Images
    runs-on: ${{ github.event.repository.name }}-runner
    outputs:
      images: ${{ steps.extract.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          cache: false
          install: false

      - name: Extract Images
        id: extract
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'images<<EOF'
            mise exec "github:home-operations/flate@${FLATE_VERSION}" -- flate diff images -p ./kubernetes/apps -o json
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  image-pull:
    if: >-
      ${{
        needs.extract.outputs.images != '[]' &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    needs: extract
    name: Image Pull - Pull Images
    runs-on: ${{ github.event.repository.name }}-runner
    permissions:
      contents: read
    strategy:
      matrix:
        image: ${{ fromJSON(needs.extract.outputs.images) }}
      max-parallel: 4
      fail-fast: false
    steps:
      - name: Setup Mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          cache: false
          install: false

      - name: Pull Image
        env:
          IMAGE: ${{ matrix.image }}
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise exec "talosctl@${TALOS_VERSION}" -- talosctl --nodes "$NODE" image pull "$IMAGE"

  zizmor:
    name: Zizmor
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          annotations: true

  ai-guards:
    name: Automation Guardrails
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test triage, migration and power safety guards
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: scripts:kubernetes/apps/ai/litellm/app:kubernetes/apps/ai/triage-worker/app
        run: python3 -m unittest test_triage_readonly test_key_policy test_worker test_nas01_migration test_ups_shutdown -v

  status:
    if: ${{ !cancelled() }}
    name: Build Success
    needs:
      - filter
      - extract
      - image-pull
      - zizmor
      - ai-guards
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: echo "All jobs passed or skipped" && echo "$RESULTS"
