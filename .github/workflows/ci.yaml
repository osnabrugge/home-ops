---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=home-operations/flate
  FLATE_VERSION: "0.8.0"
  # renovate: datasource=custom.talos-factory depName=siderolabs/talos
  TALOS_VERSION: v1.14.7

jobs:
  filter:
    if: ${{ github.event_name == 'pull_request' }}
    name: Image Pull - Filter
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      any-changed: ${{ steps.changed-files.outputs.changed_any_changed }}
      netbox-changed: ${{ steps.changed-files.outputs.netbox_any_changed }}
      grafana-changed: ${{ steps.changed-files.outputs.grafana_any_changed }}
    steps:
      - name: Get Changed Files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files_yaml: |
            changed:
              - kubernetes/**
            netbox:
              - kubernetes/apps/observability/netbox/**
            grafana:
              - kubernetes/**/*.yaml
              - kubernetes/**/*.yml

  extract:
    if: >-
      ${{
        needs.filter.outputs.any-changed == 'true' &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    needs: filter
    name: Image Pull - Extract Images
    runs-on: ${{ github.event.repository.name }}-runner
    outputs:
      images: ${{ steps.extract.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          cache: false
          install: false

      - name: Extract Images
        id: extract
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Supply only non-credential, reference-only render input for external DNS.
          images="$(mise exec "github:home-operations/flate@${FLATE_VERSION}" -- \
            flate diff images -p ./kubernetes/apps --supply .github/ci/flate-supply.yaml -o json)"
          images="$(jq -ce 'if type == "array" and all(.[]; type == "string") then . else error("expected an image string array") end' <<< "$images")"
          printf 'images=%s\n' "$images" >> "$GITHUB_OUTPUT"

      - name: Verify NetBox chart and custom-image application versions
        if: needs.filter.outputs.netbox-changed == 'true'
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise exec crane yq -- python3 scripts/check_netbox_image.py

  image-pull:
    if: >-
      ${{
        needs.extract.outputs.images != '[]' &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    needs: extract
    name: Image Pull - Pull Images
    runs-on: ${{ github.event.repository.name }}-runner
    permissions:
      contents: read
    strategy:
      matrix:
        image: ${{ fromJSON(needs.extract.outputs.images) }}
      max-parallel: 4
      fail-fast: false
    steps:
      - name: Setup Mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          cache: false
          install: false

      - name: Pull Image
        env:
          IMAGE: ${{ matrix.image }}
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise exec "talosctl@${TALOS_VERSION}" -- talosctl --nodes "$NODE" image pull "$IMAGE"

  grafana-dashboards:
    if: needs.filter.outputs.grafana-changed == 'true'
    needs: filter
    name: Grafana Dashboard Downloads
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      # Hosted CI must not load local cluster secrets or run workstation hooks.
      MISE_NO_ENV: "1"
      MISE_NO_HOOKS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          cache: false
          install: false

      - name: Check added or changed dashboard downloads
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MISE_GITHUB_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: mise exec yq -- python3 scripts/check_grafana_dashboards.py --base-ref "$BASE_SHA"

  zizmor:
    name: Zizmor
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@a818f16177a5395fc11d3c73577caabaa7119391 # v0.9.1
        with:
          advanced-security: false
          annotations: true

  ai-guards:
    name: Automation Guardrails
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test triage, migration, power, thermal and dashboard safety guards
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: scripts:kubernetes/apps/ai/litellm/app:kubernetes/apps/ai/triage-worker/app
        run: python3 -m unittest test_alert_triage test_triage_readonly test_key_policy test_worker test_nas01_migration test_ups_shutdown test_smfc_watchdog test_netbox_image test_grafana_dashboards -v

  talos-versions:
    name: Talos version consistency
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Talos and talosctl pins
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import tomllib

          expected = os.environ["TALOS_VERSION"].removeprefix("v")
          def check(path, pattern):
              matches = re.findall(pattern, pathlib.Path(path).read_text())
              if len(matches) != 1 or matches[0].removeprefix("v") != expected:
                  raise SystemExit(f"{path}: expected {expected}, found {matches}")

          check("kubernetes/apps/system-upgrade/tuppr/upgrades/talosupgrade.yaml", r"(?m)^\s+version:\s*(v?\d+\.\d+\.\d+)\s*$")
          check("talos/cluster.yaml.j2", r"factory\.talos\.dev/metal-installer-secureboot/\{\{ schematic \}\}:(v?\d+\.\d+\.\d+)")
          check("kubernetes/apps/kube-system/etcd-defrag/app/cronjob.yaml", r"(?m)^\s*reference:\s*ghcr\.io/siderolabs/talosctl:(v?\d+\.\d+\.\d+)\s*$")
          for path, version in (
              (".mise/config.toml", tomllib.loads(pathlib.Path(".mise/config.toml").read_text())["tools"]["talosctl"]),
              (".mise/mise.lock", tomllib.loads(pathlib.Path(".mise/mise.lock").read_text())["tools"]["talosctl"][0]["version"]),
          ):
              if version != expected:
                  raise SystemExit(f"{path}: expected {expected}, found {version}")
          PY

  status:
    if: ${{ !cancelled() }}
    name: Build Success
    needs:
      - filter
      - extract
      - image-pull
      - grafana-dashboards
      - zizmor
      - ai-guards
      - talos-versions
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: echo "All jobs passed or skipped" && echo "$RESULTS"
