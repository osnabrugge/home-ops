---
name: Build Brocade ICX MCP image
on:
  push:
    branches: ["main"]
    paths:
      - docker/brocade-icx-mcp/**
      - .github/workflows/brocade-mcp-image.yaml
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker/brocade-icx-mcp
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/osnabrugge/brocade-icx-mcp:1.0.0
            ghcr.io/osnabrugge/brocade-icx-mcp:latest
