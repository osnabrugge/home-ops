---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Image Pull

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter:
    name: Image Pull - Filter
    runs-on: ubuntu-latest
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Get Changed Files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@a9a36fb08ce06db9b02fbd8026cc2c0945eb9841 # v0.6.0
        with:
          patterns: kubernetes/**/*

  extract:
    # Fork guard: the pull job below runs on a self-hosted runner inside the
    # cluster, so a PR from a fork must never reach it.
    if: >-
      ${{
        needs.filter.outputs.changed-files != '[]' &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    needs: filter
    name: Image Pull - Extract Images
    runs-on: ${{ github.event.repository.name }}-runner
    outputs:
      images: ${{ steps.extract.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
          install: false

      - name: Extract Images
        id: extract
        run: |
          images="$(mise x github:home-operations/flate@0.4.9 -- flate diff images -p ./kubernetes/flux/cluster -o json)" || true
          if [ -z "$images" ]; then
            echo "flate did not produce image output" >&2
            exit 1
          fi
          python3 -m json.tool <<< "$images" >/dev/null
          echo 'images<<EOF' >> $GITHUB_OUTPUT
          echo "$images" >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

  pull:
    if: >-
      ${{
        needs.extract.outputs.images != '[]' &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    needs: extract
    name: Image Pull - Pull Images
    runs-on: ${{ github.event.repository.name }}-runner
    strategy:
      matrix:
        image: ${{ fromJSON(needs.extract.outputs.images) }}
      max-parallel: 4
      fail-fast: false
    steps:
      - name: Setup Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
          tool_versions: |
            talosctl latest

      - name: Pull Image
        env:
          IMAGE: ${{ matrix.image }}
        run: talosctl --nodes "$NODE" image pull "$IMAGE"

  success:
    if: ${{ !cancelled() }}
    needs: pull
    name: Image Pull - Success
    runs-on: ubuntu-latest
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: echo "All jobs passed or skipped" && echo "$RESULTS"
