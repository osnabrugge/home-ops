---
name: Infrastructure MCP Exposure
on:
  workflow_dispatch:
permissions: {}
jobs:
  public-boundary:
    runs-on: ubuntu-26.04
    steps:
      - name: Verify the infrastructure MCPs have no public DNS addresses
        shell: bash
        run: |
          set -euo pipefail
          control=$(curl -4 --silent --show-error --output /dev/null --max-time 20 \
            --write-out '%{http_code}' https://status.homeops.ca)
          [[ "$control" =~ ^(2|3)[0-9][0-9]$ ]]
          for name in mcp-proxmox.homeops.ca mcp-truenas.homeops.ca; do
            for type in A AAAA; do
              reply=$(dig +time=5 +tries=1 @1.1.1.1 "$name" "$type")
              grep -Eq 'status: (NOERROR|NXDOMAIN)' <<< "$reply"
              addresses=$(awk '$4 == "A" || $4 == "AAAA" { print $5 }' <<< "$reply")
              if [[ -n "$addresses" ]]; then
                echo "FAIL: $name has public $type answers: $addresses" >&2
                exit 1
              fi
              echo "PASS: $name has no public $type address."
            done
          done
          echo "PASS: outside HTTPS control works; neither MCP is publicly published."
