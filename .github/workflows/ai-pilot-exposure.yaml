---
name: AI Pilot Exposure
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Verify the AI API is not published on the public gateway
        shell: bash
        run: |
          set -euo pipefail
          control=$(curl -4 --silent --show-error --output /dev/null --max-time 20 \
            --write-out '%{http_code}' https://status.homeops.ca)
          [[ "$control" =~ ^(2|3)[0-9][0-9]$ ]]
          dns=$(dig +time=5 +tries=1 @1.1.1.1 litellm.homeops.ca A)
          if grep -q 'status: NXDOMAIN' <<< "$dns"; then
            echo "PASS: outside positive control is reachable; the internal AI hostname has no public A answer."
            exit 0
          fi
          grep -q 'status: NOERROR' <<< "$dns"
          getent ahostsv4 litellm.homeops.ca >/dev/null
          code=$(curl -4 --silent --show-error --output /dev/null --max-time 20 \
            --write-out '%{http_code}' https://litellm.homeops.ca/v1/models)
          [[ "$code" == "404" ]]
          echo "PASS: outside positive control is reachable; public gateway has no AI route (HTTP 404)."
