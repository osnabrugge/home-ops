###############################################################################
# preflight.cfg - pre-print SOP for fdm02 (Sovol SV08 + BTT Eddy / Klipper Tap)
#
# Added 2026-09-19 after a print failed with a starved purge AND a nozzle
# dragging on the plate. Two independent faults at once:
#   1. fresh filament load -> ADAPTIVE_PURGE's variable_tip_distance (10mm) was
#      not enough to bring the tip to the nozzle, so the purge extruded nothing.
#   2. tap_z_offset was commented out in options/probe/eddy-tap.cfg, so the
#      calibrated 0.14mm tap deflection was never applied.
#
# Include from printer.cfg:  [include custom/macros/preflight.cfg]
###############################################################################

# Not loaded by the stock Sovol config; every RESPOND below needs it.
[respond]
default_type: echo


[gcode_macro ASSERT_ACTIVE_FILAMENT]
description: Stub so Orca's Spoolman assert stops erroring; warns instead of failing
gcode:
    {% set want = params.ID|default(-1)|int %}
    {% if want >= 0 %}
        { action_respond_info("ASSERT_ACTIVE_FILAMENT: gcode expects Spoolman ID %d (not enforced)" % want) }
    {% endif %}


[gcode_macro PRIME_NOZZLE]
description: Push filament until it actually flows. Run after ANY filament change.
gcode:
    {% set temp = params.TEMP|default(220)|int %}
    {% set amount = params.AMOUNT|default(120)|int %}

    {% if printer.print_stats.state == "printing" %}
        { action_respond_info("PRIME_NOZZLE: refusing to run mid-print") }
    {% else %}
        {% if printer.toolhead.homed_axes|lower != "xyz" %}
            G28
        {% endif %}
        M117 Priming
        M104 S{temp}
        G90
        G0 X175 Y10 Z50 F6000          ; front centre, well clear of the plate
        M109 S{temp}

        M83
        # split so each move stays under max_extrude_only_distance (150)
        {% for _ in range((amount / 40) | round(0, 'ceil') | int) %}
            G1 E40 F120                ; 2mm/s - slow enough not to strip the filament
        {% endfor %}
        G1 E-1 F1800
        G92 E0
        M400
        { action_respond_info("PRIME_NOZZLE: pushed ~%dmm. Plastic should be hanging from the nozzle - clear it before printing." % amount) }
        M117 Primed - clear the blob
    {% endif %}


# Lay one test line at whatever offset is currently set.
[gcode_macro _FL_LINE]
gcode:
    {% set y = params.Y|float %}
    {% set x0 = params.X0|float %}
    {% set x1 = params.X1|float %}
    {% set z = params.Z|float %}
    {% set e = params.E|float %}
    G0 X{x0} Y{y} Z{z + 1.0} F6000
    G0 Z{z} F600
    G1 X{x1} Y{y} E{e} F1200
    G1 E-0.8 F1800
    G0 Z{z + 1.0} F600


[gcode_macro Z_OFFSET_LADDER]
description: One run, N lines, each at a different Z offset. Pick the best - no iteration.
gcode:
    {% set bed   = params.BED|default(60)|int %}
    {% set temp  = params.TEMP|default(220)|int %}
    {% set lh    = params.LAYER_HEIGHT|default(0.2)|float %}
    {% set lw    = params.LINE_WIDTH|default(0.45)|float %}
    {% set len   = params.LENGTH|default(150)|float %}
    {% set start = params.START|default(0.04)|float %}
    {% set step  = params.STEP|default(0.04)|float %}
    {% set lines = params.LINES|default(5)|int %}
    {% set prep  = params.PREP|default(0)|int %}

    {% set e_per_mm = (lh * lw) / 2.405 %}
    {% set x0 = 175 - len/2 %}
    {% set x1 = 175 + len/2 %}
    {% set e_line = len * e_per_mm %}

    M117 Z ladder
    M140 S{bed}
    {% if prep == 1 %}
        M104 S150
        M190 S{bed}
        M109 S150
        G28
        QUAD_GANTRY_LEVEL
        G28 Z
        BED_MESH_CALIBRATE
    {% else %}
        {% if printer.toolhead.homed_axes|lower != "xyz" %}
            G28
        {% endif %}
        M190 S{bed}
    {% endif %}

    M104 S{temp}
    G90
    G0 X{x0} Y25 Z5 F6000
    M109 S{temp}

    # prime as a fat line ON the bed, then break the string - never in mid air
    M83
    SET_GCODE_OFFSET Z=0 MOVE=0
    G0 Z{lh + 1.0} F600
    G0 Z{lh} F600
    G1 X{x0 + 60} Y25 E{60 * e_per_mm * 3} F600
    G1 E-0.8 F1800
    G0 Z{lh + 5} F600
    G0 X{x0} Y32 F6000
    G0 X{x0 + 20} Y32 F6000

    {% for i in range(lines) %}
        {% set off = start - i * step %}
        {% set y = 40 + i * 6 %}
        SET_GCODE_OFFSET Z={off} MOVE=0
        RESPOND MSG="line {i + 1}  Y={y}  offset={off}"
        _FL_LINE Y={y} X0={x0} X1={x1} Z={lh} E={e_line}
    {% endfor %}

    SET_GCODE_OFFSET Z=0 MOVE=0
    G0 Z30 F600
    G0 X175 Y10 F6000
    M104 S0
    M400
    RESPOND MSG="LADDER DONE - lines run front to back, Y=40 is line 1."
    RESPOND MSG="Line 1 = HIGHEST nozzle, last line = LOWEST."
    RESPOND MSG="Pick the flat, fused, matte one, then SET_GCODE_OFFSET Z=<its offset> MOVE=0"
    M117 Pick the best line


[gcode_macro FIRST_LAYER_TEST]
description: Confirm one chosen Z. Use Z_OFFSET_LADDER to FIND the Z.
gcode:
    {% set bed  = params.BED|default(60)|int %}
    {% set temp = params.TEMP|default(220)|int %}
    {% set prep = params.PREP|default(0)|int %}
    Z_OFFSET_LADDER BED={bed} TEMP={temp} PREP={prep} LINES=4 STEP=0 START={printer.gcode_move.homing_origin[2]}


[gcode_macro PREFLIGHT]
description: Pre-print SOP. PREFLIGHT CHANGED=filament|plate|nozzle|config|none
gcode:
    {% set changed = params.CHANGED|default('none')|string|lower %}
    {% set bed = params.BED|default(60)|int %}
    {% set temp = params.TEMP|default(220)|int %}

    RESPOND MSG="=== PREFLIGHT (changed: {changed}) ==="

    # QGL staleness is the fault that silently ruins first layers
    {% if printer.quad_gantry_level.applied|lower != 'true' %}
        RESPOND MSG="!! QGL NOT applied this session - run QUAD_GANTRY_LEVEL before printing"
    {% else %}
        RESPOND MSG="QGL applied this session - OK"
    {% endif %}

    {% set tap = printer.configfile.settings['probe_eddy_current btt_eddy'].tap_z_offset|default(0)|float %}
    {% set babystep = printer.gcode_move.homing_origin[2]|float %}
    RESPOND MSG="tap_z_offset={tap}  babystep={babystep}  net={tap + babystep}"

    {% if printer['filament_switch_sensor filament_sensor'].filament_detected != True %}
        RESPOND MSG="!! no filament at the sensor"
    {% endif %}

    {% if changed in ('filament', 'nozzle') %}
        RESPOND MSG="-> priming; afterwards run Z_OFFSET_LADDER BED={bed} TEMP={temp}"
        PRIME_NOZZLE TEMP={temp}
    {% elif changed in ('plate', 'config', 'probe') %}
        RESPOND MSG="-> Z reference suspect, running ladder with full prep"
        Z_OFFSET_LADDER BED={bed} TEMP={temp} PREP=1
    {% else %}
        RESPOND MSG="-> nothing changed: safe to print"
    {% endif %}
